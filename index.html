      case 'End': return go(r, vis[vis.length - 1], e.shiftKey);
      case 'Enter': case 'F2': e.preventDefault(); return startEdit(r, c, false);
      case 'Delete': case 'Backspace': e.preventDefault(); return clearRange();
      case 'Escape': if (store.sel.size) { store.sel.clear(); onChange(); } setAnc({ r: act.r, c: act.c }); return;
      default:
        if (e.key.length === 1 || e.key === 'Process' || e.key === 'Unidentified') startEdit(r, c, true);   // gõ thẳng để thay nội dung ô
    }
  };
  const onCopy = (e) => {
    if (e.target.tagName === 'INPUT' || !n) return;
    let text;
    if (store.sel.size) text = Array.from(store.sel).sort((a, b) => a - b).map(r => store.data[r].map(tsvQ).join('\t')).join('\n');
    else {                                                    // chép cả vùng ô đang chọn
      const cs = vis.filter(c => c >= C1 && c <= C2), lines = [];
      for (let r = R1; r <= R2; r++) lines.push(cs.map(c => tsvQ(store.data[r][c])).join('\t'));
      text = lines.join('\n');
    }
    e.clipboardData.setData('text/plain', text); e.preventDefault();
  };
  const onPaste = (e) => {
    if (e.target.tagName === 'INPUT') return;
    e.preventDefault();
    const text = e.clipboardData.getData('text'); if (!text || !n || locked) return;
    // Dán theo vị trí cột THẬT (A, B, C…): cột đang ẩn vẫn nhận dữ liệu như trên Google Sheet
    const m = parseTSV(text), r0 = R1, c0 = fixCol(C1);
    if (r0 < (store.base || 0)) { alert('Các dòng 1–' + store.base + ' là lệnh đã lưu (chỉ đọc, sẽ không lưu lại). Hãy bấm vào ô cột A của dòng ' + (store.base + 1) + ' rồi dán.'); return; }
    let skipped = 0;
    const need = r0 + m.length - store.data.length;
    if (need > 0) { if (canAdd) { for (let k = 0; k < need; k++) store.data.push(blankRow()); } else skipped = need; }
    const map = new Map();
    m.forEach((line, i) => {
      const r = r0 + i; if (r >= store.data.length) return;
      const row = store.data[r].slice();
      line.forEach((v, j) => { if (c0 + j < BK_N) row[c0 + j] = v; });
      map.set(r, row);
    });
    applyRows(map);
    if (skipped) alert('Đã bỏ qua ' + skipped + ' dòng cuối vì vượt quá số dòng đang hiển thị. Muốn thêm dòng mới hãy dùng nút Import.');
  };

  H.current = { down, edit: startEdit, edChange, edKey, edBlur, move, up, tick };

  // Mở bảng: cuộn tới dòng mới đầu tiên (ngay sau lệnh gần nhất) và focus sẵn để Ctrl+V
  useEffect(() => {
    if (!store.base) return;
    const t = setTimeout(() => {
      const el = boxRef.current; if (!el) return;
      el.scrollTop = Math.max(0, (store.base - 3) * BK_RH);
      el.focus({ preventScroll: true });
    }, 30);
    return () => clearTimeout(t);
  }, []);

  // ---------- vẽ (chỉ vẽ các dòng đang nhìn thấy) ----------
  const first = Math.max(0, Math.floor(scrollTop / BK_RH) - 6);
  const last = Math.min(n, first + Math.ceil(vh / BK_RH) + 14);
  const dragOn = drag && drag.a !== drag.b;
  const lo = dragOn ? Math.min(drag.a, drag.b) : 0, hi = dragOn ? Math.max(drag.a, drag.b) : -1;
  const isSel = (r) => (dragOn && r >= lo && r <= hi) ? drag.mode === 'add' : store.sel.has(r);
  const grip = <span className="xg-grip" title="Kéo để đổi ranh cột cố định" onMouseDown={startFreeze} onClick={e => e.stopPropagation()} />;

  return (
    <div ref={boxRef} className="xg-box" tabIndex={0} onScroll={e => setScrollTop(e.currentTarget.scrollTop)}
         onKeyDown={onKey} onCopy={onCopy} onPaste={onPaste}>
      <table className="xg" style={{ width: totalW }}>
        <colgroup><col style={{ width: BK_RNW }} />{vis.map(c => <col key={c} style={{ width: BK_COLW[c] }} />)}</colgroup>
        <thead ref={headRef}>
          <tr className="h1">
            <th className="rn" title="Chọn / bỏ chọn tất cả"
                onClick={() => { if (store.sel.size === n) store.sel.clear(); else for (let i = 0; i < n; i++) store.sel.add(i); onChange(); }}>#{lastFz < 0 && grip}</th>
            {vis.map(c => (
              <th key={c} className={(c < fz ? 'fz ' : '') + (c === lastFz ? 'fz-last' : '')} style={c < fz ? { left: lefts[c] } : undefined}>
                {BK_LETTERS[c]}{c === lastFz && grip}
              </th>
            ))}
          </tr>
          <tr className="h2">
            <th className="rn">{lastFz < 0 && grip}</th>
            {vis.map(c => (
              <th key={c} className={(c < fz ? 'fz ' : '') + (c === lastFz ? 'fz-last' : '')} style={c < fz ? { left: lefts[c] } : undefined}
                  title={BK_LETTERS[c] + ': ' + BK_HEAD[c]}>
                {BK_HEAD[c]}{c === lastFz && grip}
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {first > 0 && <tr><td colSpan={vis.length + 1} style={{ height: first * BK_RH, padding: 0, border: 0 }}></td></tr>}
          {Array.from({ length: Math.max(0, last - first) }, (_, k) => {
            const r = first + k;
            return <XRow key={r} r={r} row={store.data[r]} orig={store.orig ? store.orig[r] : null} sel={isSel(r)}
                         lk={r < (store.base || 0)} nw={(store.base || 0) > 0 && r === store.base}
                         actC={act.r === r ? act.c : -1} ed={ed && ed.r === r ? ed : null}
                         no={store.nums.length ? store.nums[r] : r + 1} H={H}
                         vis={vis} lefts={lefts} fz={fz} lastFz={lastFz}
                         rc1={multi && r >= R1 && r <= R2 ? C1 : -1} rc2={multi && r >= R1 && r <= R2 ? C2 : -1} />;
          })}
          {last < n && <tr><td colSpan={vis.length + 1} style={{ height: (n - last) * BK_RH, padding: 0, border: 0 }}></td></tr>}
        </tbody>
      </table>
    </div>
  );
}

// ---- Hộp chọn cột hiển thị / ẩn (chỉ ẩn trên màn hình, dữ liệu vẫn được dán vào các cột ẩn) ----
function ColPickPop({ store, pos, onChange, onClose }) {
  const [q, setQ] = useState('');
  const hid = store.hidden;
  const items = BK_LETTERS.map((L, i) => ({ i, L, h: BK_HEAD[i] }))
    .filter(x => (x.L + ' ' + x.h).toLowerCase().includes(q.trim().toLowerCase()));
  const commit = () => { store.hver = (store.hver || 0) + 1; if (store.persist) saveBkView(store); onChange(); };
  const toggle = (i) => { if (hid.has(i)) hid.delete(i); else { if (hid.size >= BK_N - 1) return; hid.add(i); } commit(); };
  const showAll = () => { hid.clear(); commit(); };
  const hideShown = () => { items.forEach(x => { if (hid.size < BK_N - 1) hid.add(x.i); }); commit(); };
  const showShown = () => { items.forEach(x => hid.delete(x.i)); commit(); };
  const left = Math.max(8, Math.min(pos.x, window.innerWidth - 330));
  return (
    <div className="no-print" style={{ position: 'fixed', inset: 0, zIndex: 95 }} onMouseDown={onClose}>
      <div className="flt-pop" style={{ left, top: pos.y, width: 320 }} onMouseDown={e => e.stopPropagation()}>
        <div className="flex items-center justify-between">
          <b className="text-slate-700">Cột hiển thị ({BK_N - hid.size}/{BK_N})</b>
          <button className="btn" onClick={onClose}>Đóng</button>
        </div>
        <input className="inp" placeholder="Tìm cột (vd: C, Tiện, TBCD…)" value={q} onChange={e => setQ(e.target.value)} autoFocus />
        <div className="flex flex-wrap gap-2">
          <button className="pill" onClick={showAll}>Hiện tất cả</button>
          <button className="pill" onClick={showShown}>Hiện kết quả lọc</button>
          <button className="pill" onClick={hideShown}>Ẩn kết quả lọc</button>
        </div>
        <div className="flt-list" style={{ maxHeight: 320 }}>
          {items.map(x => (
            <label key={x.i} className="flt-row">
              <input type="checkbox" checked={!hid.has(x.i)} onChange={() => toggle(x.i)} />
              <span><b>{x.L}</b> · {x.h}</span>
            </label>
          ))}
          {!items.length && <p className="text-xs text-gray-400 p-1">Không có cột phù hợp.</p>}
        </div>
        <div className="flex flex-wrap gap-2 items-center">
          <span className="text-xs text-slate-500">Cố định:</span>
          <button className="pill" onClick={() => { store.freeze = 0; commit(); }}>Bỏ cố định</button>
          <button className="pill" onClick={() => { store.freeze = 2; commit(); }}>A : B</button>
        </div>
        <p className="text-xs text-gray-400">Kéo thanh ở mép phải tiêu đề cột cố định để đổi ranh. Cột ẩn vẫn nhận dữ liệu khi dán.</p>
      </div>
    </div>
  );
}

// Lấy N lệnh cuối cùng (theo id lớn nhất = lệnh up sau cùng), mới nhất đứng đầu
const lastLsxList = async (n) => {
  const out = []; let from = 0, top = null;
  while (out.length < n && from < 10000) {
    const { data, error } = await supabase.from(TB_KANBAN).select('id, col_a, sheet_row').order('id', { ascending: false }).range(from, from + 999);
    if (error) throw error;
    if (!top && data && data[0]) top = data[0];
    (data || []).forEach(d => { if (d.col_a && !out.includes(d.col_a)) out.push(d.col_a); });
    if (!data || data.length < 1000) break;
    from += 1000;
  }
  return { list: out.slice(0, n), top };
};

function BomKanban({ active }) {
  const [mode, setMode] = useState('import');          // 'import' = Up Bom (mở trước) · 'edit' = Sửa Bom
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [busy, setBusy] = useState('');
  const [msg, setMsg] = useState(null);
  const [colPop, setColPop] = useState(null);           // vị trí hộp chọn cột (null = đóng)
  const { can } = useAuth();
  const [cfgOpen, setCfgOpen] = useState(false);
  const [lastN, setLastN] = useState(() => { try { const n = Number(localStorage.getItem('bk_lastn_v1')); return [1, 2, 3, 4, 5].includes(n) ? n : 1; } catch (e) { return 1; } });
  const lastNRef = useRef(lastN);
  const [gk, setGk] = useState(0);                      // đổi số này để dựng lại lưới
  const [, bump] = useState(0);
  const re = () => bump(x => x + 1);
  const eRef = useRef(null); if (!eRef.current) eRef.current = newBkStore();
  const iRef = useRef(null);
  if (!iRef.current) {
    iRef.current = newBkStore(); iRef.current.data = Array.from({ length: 30 }, blankRow);
    iRef.current.hidden = loadHidden(); iRef.current.freeze = loadFreeze(); iRef.current.persist = true;   // chỉ bảng Up BOM nhớ cấu hình cột
  }
  const E = eRef.current, I = iRef.current;
  const lsxList = useLsxList(active);
  const busyRef = useRef(''); busyRef.current = busy;
  const [lastInfo, setLastInfo] = useState(null);                 // { sb, sh, shErr }
  const shRef = useRef({ at: 0, v: null, err: '' });              // Sheet chỉ hỏi tối đa 1 lần/phút để đỡ tốn quota Apps Script

  // ----- Hộp thoại xác nhận (thay cho confirm() của trình duyệt) -----
  const [dlg, setDlg] = useState(null);
  const [pick, setPick] = useState('');
  const ask = (o) => new Promise(res => { setPick(o.def || ''); setDlg({ ...o, res }); });
  const closeDlg = (v) => { if (dlg) dlg.res(v && dlg.options ? pick : v); setDlg(null); };
  useEffect(() => {
    if (!dlg) return;
    const h = (e) => { if (e.key === 'Escape') closeDlg(false); };
    window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h);
  }, [dlg]);
  const ok = (s, title) => notify('success', title || 'Hoàn tất', String(s).replace(/^✔\s*/, ''));
  const bad = (s) => notify('error', 'Có lỗi xảy ra', s);

  // Nạp LỆNH GẦN ĐÂY NHẤT (toàn bộ các dòng của lệnh đó) lên bảng Up Bom.
  // I.base = số dòng đã có -> các dòng này chỉ đọc, khi lưu chỉ lưu từ dòng I.base + 1 trở đi.
    // Lệnh cuối cùng: Supabase (dòng có sheet_row lớn nhất) + Google Sheet (dòng cuối cột A)
  const fetchLastInfo = async (force, noSheet) => {
    let sb;
    try {
      const { data, error } = await supabase.from(TB_KANBAN).select('id, col_a, col_b, sheet_row')
        .order('id', { ascending: false }).limit(1);
      if (error) throw error;
      const d = data && data[0];
      sb = { id: d ? d.id : 0, lsx: d ? String(d.col_a || '').trim() : '', stt: d ? String(d.col_b || '').trim() : '', row: d ? (d.sheet_row || 0) : 0 };
    } catch (e) { return null; }
    if (!noSheet && (force || Date.now() - shRef.current.at > 60000)) {
      try {
        const j = await gs('last', {});
        shRef.current = { at: Date.now(), v: { lsx: j.lsx || '', stt: j.stt || '', row: j.row || 0 }, err: '' };
      } catch (e) { shRef.current = { at: Date.now(), v: null, err: String(e.message || e) }; }
    }
    setLastInfo({ sb, sh: shRef.current.v, shErr: shRef.current.err });
    return { sb };
  };

  // Nạp LỆNH GẦN ĐÂY NHẤT (toàn bộ các dòng của lệnh đó) lên bảng Up Bom.
  // I.base = số dòng đã có -> các dòng này chỉ đọc, khi lưu chỉ lưu từ dòng I.base + 1 trở đi.
    const loadLatest = async (quiet, nOv) => {
    const n = nOv || lastNRef.current || 1;
    setBusy('Đang tải ' + (n > 1 ? n + ' lệnh' : 'lệnh') + ' gần đây nhất…'); if (!quiet) setMsg(null);
    try {
      const { list, top } = await lastLsxList(n);
      let arr = [];
      if (list.length) {
        const data = await fetchAll(() => supabase.from(TB_KANBAN).select('*').in('col_a', list).order('sheet_row').order('id'));
        const ord = new Map(list.map((k, i) => [normKey(k), i]));          // lệnh cũ nằm trên, lệnh mới nhất nằm sát vùng dán
        data.sort((a, b) => (ord.get(normKey(b.col_a)) ?? 0) - (ord.get(normKey(a.col_a)) ?? 0) || (a.sheet_row || 0) - (b.sheet_row || 0) || a.id - b.id);
        arr = data.map(d => BK_LETTERS.map(L => { const x = d['col_' + L.toLowerCase()]; return x == null ? '' : String(x); }));
      }
      I.data = arr.concat(Array.from({ length: 30 }, blankRow));
      I.base = arr.length; I.baseLsx = String(list[0] || '').trim(); I.baseRow = top ? (top.sheet_row || 0) : 0;
      I.baseId = top ? (top.id || 0) : 0;
      I.sel = new Set(); I.undo = [];
      setGk(k => k + 1);
      fetchLastInfo(true);
      if (!quiet) ok(arr.length ? 'Đã nạp ' + list.length + ' lệnh gần đây nhất (' + arr.length + ' dòng). Hãy dán lệnh mới từ dòng ' + (arr.length + 1) + '.' : 'Chưa có lệnh nào trong Supabase.', 'Đã nạp lệnh gần đây nhất');
    } catch (e) { if (!quiet) bad('Không tải được: ' + (e.message || e)); }
    setBusy('');
  };
  // Mỗi lần bấm vào tab BOM Kanban: nếu chưa có dòng mới nào đang dán dở thì nạp lại lệnh gần nhất
  // Vào tab: nạp lệnh cuối. Sau đó cứ 20 giây (và khi quay lại trình duyệt) kiểm tra, có người up lệnh mới thì tự nạp lại
  useEffect(() => {
    if (!active || mode !== 'import') return;
    let alive = true;
    if (!importFilled().length) loadLatest(true); else fetchLastInfo(true);
    const tick = async () => {
      if (!alive || document.hidden || busyRef.current) return;
      const info = await fetchLastInfo(false);
      if (!alive || !info || busyRef.current || importFilled().length) return;   // đang dán dở thì không đụng vào bảng
      if (info.sb.lsx !== (I.baseLsx || '') || info.sb.id !== (I.baseId || 0)) loadLatest(true);
    };
    const t = setInterval(tick, 20000);
    const vis = () => { if (!document.hidden) tick(); };
    document.addEventListener('visibilitychange', vis);
    return () => { alive = false; clearInterval(t); document.removeEventListener('visibilitychange', vis); };
  }, [active, mode]);

  // ----- Tìm LSX -----
  const search = async (val) => {
    const v = (typeof val === 'string' ? val : input).trim(); if (!v) return;
    if (E.dirty.size && !(await ask({ danger: true, icon: 'fa-triangle-exclamation', title: 'Bỏ thay đổi chưa lưu?',
      message: 'Tìm lại sẽ làm mất các chỉnh sửa chưa lưu.', chips: [E.dirty.size + ' dòng đã sửa'], confirmText: 'Bỏ & tìm lại' }))) return;
    setLoading(true); setMsg(null);
    try {
      let data = await fetchAll(() => supabase.from(TB_KANBAN).select('*').eq('col_a', v).order('sheet_row'));
      if (!data.length) data = await fetchAll(() => supabase.from(TB_KANBAN).select('*').ilike('col_a', `%${v}%`).order('sheet_row'));
      const arr = data.map(d => BK_LETTERS.map(L => { const x = d['col_' + L.toLowerCase()]; return x == null ? '' : String(x); }));
      E.data = arr; E.orig = arr.slice(); E.ids = data.map(d => d.id); E.nums = data.map(d => d.sheet_row);
      E.sel = new Set(); E.dirty = new Set(); E.undo = []; E.loaded = v;
      setGk(k => k + 1);
    } catch (e) { bad('Lỗi tải dữ liệu: ' + e.message); }
    setLoading(false);
  };

    // ----- Lưu các dòng đã sửa: Supabase trước, rồi sang Google Sheet (chỉ các ô đã đổi) -----
  const saveEdit = async () => {
    if (!can('bomkanban.edit')) return alert('Bạn không có quyền Sửa BOM.');
    const idx = Array.from(E.dirty).sort((a, b) => a - b); if (!idx.length) return;
    const yes = await ask({ icon: 'fa-floppy-disk', title: 'Lưu thay đổi',
      message: 'Dữ liệu được lưu vào Supabase trước, sau đó đồng bộ sang Google Sheet (chỉ ghi các ô đã sửa).',
      chips: ['LSX: ' + E.loaded, idx.length + ' dòng'], confirmText: 'Lưu & đồng bộ' });
    if (!yes) return;
    setMsg(null);
    try {
      let done = 0;
      for (let s = 0; s < idx.length; s += 200) {
        setBusy('Đang lưu Supabase… ' + Math.min(s + 200, idx.length) + '/' + idx.length);
        const part = idx.slice(s, s + 200).map(r => [E.ids[r], E.nums[r]].concat(E.data[r]));
        const { data, error } = await supabase.rpc('bkx_save', { p_rows: part });
        if (error) throw new Error(/lsx_key|duplicate/i.test(error.message) ? 'Trùng khoá LSX-STT với một dòng khác — hãy đổi lại LSX/STT.' : error.message);
        done += data.updated;
      }
      notify('success', 'Đã lưu vào Supabase', done + ' dòng đã được cập nhật. Đang đồng bộ sang Google Sheet…');
      try {
        for (let s = 0; s < idx.length; s += 200) {
          setBusy('Đang đồng bộ sang Google Sheet… ' + Math.min(s + 200, idx.length) + '/' + idx.length);
          await gs('upsert', { items: idx.slice(s, s + 200).map(r => ({
            key: bkKey(E.data[r], E.nums[r]), oldKey: bkKey(E.orig[r], E.nums[r]), row: E.nums[r] || 0,
            values: E.data[r], cols: diffCols(E.orig[r], E.data[r]) })) });
        }
      } catch (e) {
        bad('Đã lưu Supabase nhưng CHƯA ghi sang Google Sheet: ' + (e.message || e) + '. Hãy bấm "Lưu thay đổi" lần nữa để thử lại — nếu bỏ qua, lần đồng bộ Sheet→Supabase sau có thể ghi đè lại chỉnh sửa này.');
        setBusy(''); re(); return;
      }
      idx.forEach(r => { E.orig[r] = E.data[r]; }); E.dirty.clear();
      if (done < idx.length) bad('Đã lưu ' + done + '/' + idx.length + ' dòng trên Supabase. Số còn lại không tìm thấy (có thể vừa được đồng bộ lại) — hãy bấm Tìm lại.');
      else notify('success', 'Đã ghi Google Sheet xong', done + ' dòng đã được đồng bộ sang Google Sheet.');
      window.dispatchEvent(new Event('bk-changed'));
    } catch (e) { bad('Lưu thất bại: ' + (e.message || e)); }
    setBusy(''); re();
  };

    // ----- Xoá các dòng đang chọn: xoá ĐỒNG THỜI trên Google Sheet và Supabase -----
  const deleteSel = async () => {
    if (!can('bomkanban.delete')) return alert('Bạn không có quyền xoá dòng BOM.');
    const idx = Array.from(E.sel).sort((a, b) => a - b); if (!idx.length) return;
    const yes = await ask({ danger: true, icon: 'fa-trash-can', title: 'Xác nhận xoá BOM',
      message: 'Các dòng BOM đã chọn sẽ được xoá khỏi Supabase và Google Sheet.',
      chips: ['LSX: ' + E.loaded, idx.length + ' dòng'],
      warn: 'Thao tác này không thể hoàn tác.', confirmText: 'Xác nhận xoá' });
    if (!yes) return;
    setMsg(null);
    let gsN = 0, sheetDone = false;
    try {
      setBusy('Đang xoá trên Google Sheet…');                    // Sheet trước: nếu Supabase lỗi thì bấm xoá lại vẫn an toàn
      gsN = (await gs('delete', { items: idx.map(r => ({ key: bkKey(E.orig[r], E.nums[r]), row: E.nums[r] })) })).deleted;
      sheetDone = true;
      notify('success', 'Đã xoá trên Google Sheet', gsN + ' dòng đã được xoá. Đang xoá trên Supabase…');
      setBusy('Đang xoá trên Supabase…');
      for (let s = 0; s < idx.length; s += 500) {
        const { error } = await supabase.rpc('bkx_remove', { p_ids: idx.slice(s, s + 500).map(r => E.ids[r]) });
        if (error) throw error;
      }
      notify('success', 'Đã xoá trên Supabase', idx.length + ' dòng đã được xoá.');
      const keep = E.data.map((_, i) => i).filter(i => !E.sel.has(i));
      const oldDirty = E.dirty;
      E.data = keep.map(i => E.data[i]); E.orig = keep.map(i => E.orig[i]);
      E.ids = keep.map(i => E.ids[i]); E.nums = keep.map(i => E.nums[i]);
      E.dirty = new Set(); keep.forEach((o, nI) => { if (oldDirty.has(o)) E.dirty.add(nI); });
      E.sel = new Set(); E.undo = [];
      window.dispatchEvent(new Event('bk-changed'));
      setGk(k => k + 1);
      const doneMsg = '✔ Đã xoá ' + idx.length + ' dòng trên Supabase và ' + gsN + ' dòng trên Google Sheet.';
      if (!E.dirty.size && E.loaded) await search(E.loaded);     // lấy lại số dòng Sheet mới (các dòng bên dưới đã dịch lên)
    } catch (e) {
      bad((sheetDone ? 'Đã xoá trên Google Sheet nhưng xoá Supabase lỗi: ' : 'Xoá thất bại: ') + (e.message || e) + (sheetDone ? '. Hãy bấm Xoá lần nữa để hoàn tất.' : ''));
    }
    setBusy(''); re();
  };

  // ----- Import: ghi Supabase trước, rồi đồng bộ xuống Google Sheet -----
  const importFilled = () => I.data.map((r, i) => ({ r, i })).filter(x => x.i >= (I.base || 0) && x.r.some(v => String(v).trim() !== ''));
    const saveImport = async () => {
    const rows = importFilled();
    if (!can('bomkanban.up')) return alert('Bạn không có quyền Up BOM.');
    if (!rows.length) return alert('Chưa có dữ liệu để lưu.');
    const miss = rows.filter(x => !bkTrim(x.r[0]) || !bkTrim(x.r[1]));
    if (miss.length) return alert('Có ' + miss.length + ' dòng thiếu Lệnh sản xuất (cột A) hoặc STT (cột B), ví dụ dòng ' + miss.slice(0, 5).map(x => x.i + 1).join(', ') + '. Hãy điền hoặc xoá các dòng này.');
        // Kiểm tra lại lệnh cuối ngay trước khi lưu: có người vừa up thì cảnh báo để khỏi up trùng
    setBusy('Đang kiểm tra lệnh cuối…');
    const li = await fetchLastInfo(true, true);     // chỉ hỏi Supabase cho nhanh, không chờ Google Sheet
    setBusy('');
    if (li && (li.sb.lsx !== (I.baseLsx || '') || li.sb.id !== (I.baseId || 0))) {
      const go = await ask({ danger: true, icon: 'fa-triangle-exclamation', title: 'Có lệnh mới vừa được up!',
        message: 'Lệnh cuối cùng hiện tại là ' + (li.sb.lsx || '—') + ' (dòng ' + li.sb.row + '), khác với lệnh cuối trên bảng của bạn (' + (I.baseLsx || '—') + '). Nên bấm Hủy, nạp lại lệnh gần đây nhất rồi up nối tiếp để không bị trùng.',
        confirmText: 'Vẫn lưu' });
      if (!go) return;
    }
    const lastIdx = new Map(); rows.forEach((x, k) => lastIdx.set(bkKey(x.r, 0), k));
    const uniq = rows.filter((x, k) => lastIdx.get(bkKey(x.r, 0)) === k);        // trùng khoá LSX-STT: giữ dòng sau cùng
    const dup = rows.length - uniq.length;
    setMsg(null);
    const rowOf = {};                                           // khoá -> số dòng Sheet (dòng đã có sẵn trên Supabase)
    try {
      setBusy('Đang kiểm tra dòng đã có…');
      for (let s = 0; s < uniq.length; s += 500) {
        const { data, error } = await supabase.rpc('bkx_rows_of', { p_keys: uniq.slice(s, s + 500).map(x => bkKey(x.r, 0)) });
        if (error) throw error;
        Object.assign(rowOf, data || {});
      }
    } catch (e) { bad('Kiểm tra dòng đã có thất bại: ' + (e.message || e)); setBusy(''); return; }
    setBusy('');
    const exist = Object.keys(rowOf).length;
    const lsxs = Array.from(new Set(uniq.map(x => bkTrim(x.r[0])))).slice(0, 4);
    const yes = await ask({ danger: exist > 0, icon: exist ? 'fa-triangle-exclamation' : 'fa-file-import',
      title: exist ? 'Có dòng đã tồn tại!' : 'Thêm dòng mới',
      message: exist
        ? exist + ' dòng có cùng LSX-STT đã có sẵn trên Supabase/Google Sheet và sẽ bị GHI ĐÈ, không tạo dòng mới.'
        : 'Dữ liệu được ghi vào Supabase trước, sau đó nối tiếp xuống cuối Google Sheet (cột A → FA).',
      chips: ['LSX: ' + lsxs.join(', '), uniq.length + ' dòng', (uniq.length - exist) + ' dòng mới']
        .concat(exist ? [exist + ' dòng ghi đè'] : [])
        .concat(dup ? [dup + ' dòng trùng khoá trong bảng (giữ dòng sau cùng)'] : []),
      warn: exist ? 'Nếu bạn up lệnh mới, hãy kiểm tra lại tên lệnh ở cột A.' : undefined,
      confirmText: exist ? 'Vẫn ghi đè' : 'Lưu & đồng bộ' });
    if (!yes) return;
    try {
      for (let s = 0; s < uniq.length; s += 200) {
        setBusy('Đang ghi Supabase… ' + Math.min(s + 200, uniq.length) + '/' + uniq.length);
        const { error } = await supabase.rpc('bkx_save', { p_rows: uniq.slice(s, s + 200).map(x => [null, null].concat(x.r.map(String))) });
        if (error) throw error;
      }
    } catch (e) { bad('Lưu Supabase thất bại: ' + (e.message || e)); setBusy(''); return; }
    notify('success', 'Đã lưu vào Supabase', uniq.length + ' dòng đã được ghi. Đang ghi xuống Google Sheet…');
    try {
      for (let s = 0; s < uniq.length; s += 400) {
        setBusy('Đang ghi xuống Google Sheet… ' + Math.min(s + 400, uniq.length) + '/' + uniq.length);
        await gs('upsert', { items: uniq.slice(s, s + 400).map(x => {
          const key = bkKey(x.r, 0);
          return { key, row: rowOf[key] || 0, known: key in rowOf, values: x.r.map(String), cols: null };
        }) });
      }
    } catch (e) {
      bad('Đã ghi Supabase nhưng GHI SHEET LỖI: ' + (e.message || e) + '. Dữ liệu vẫn còn trong bảng, hãy bấm Lưu lần nữa để thử lại (an toàn, không tạo dòng trùng).');
      setBusy(''); return;
    }
    window.dispatchEvent(new Event('bk-changed'));
    await loadLatest(true);          // bảng nạp lại = lệnh vừa lưu (nằm cuối), lệnh mới dán tiếp bên dưới
    notify('success', 'Đã ghi Google Sheet xong', uniq.length + ' dòng đã được nối tiếp xuống cuối Sheet.');
  };

    // ----- Nút "Lệnh gần đây nhất" -----
  const loadLatestBtn = async () => {
    if (importFilled().length && !(await ask({ icon: 'fa-clock-rotate-left', title: 'Thay nội dung bảng?',
      message: 'Bảng đang có dòng mới chưa lưu. Nạp lệnh gần đây nhất sẽ thay thế toàn bộ nội dung này.', confirmText: 'Thay thế' }))) return;
    await loadLatest(false);
  };
  const pickLastN = async (n) => {
    if (n === lastN) return;
    if (importFilled().length && !(await ask({ icon: 'fa-clock-rotate-left', title: 'Thay nội dung bảng?',
      message: 'Bảng đang có dòng mới chưa lưu. Đổi số lệnh hiển thị sẽ thay thế toàn bộ nội dung này.', confirmText: 'Thay thế' }))) return;
    setLastN(n); lastNRef.current = n;
    try { localStorage.setItem('bk_lastn_v1', String(n)); } catch (e) {}
    await loadLatest(false, n);
  };
  const addRows = () => { for (let k = 0; k < 100; k++) I.data.push(blankRow()); re(); };
  // Xoá hết: xoá luôn, KHÔNG hỏi xác nhận (muốn lấy lại lệnh gần nhất thì bấm "Lệnh gần đây nhất")
  const clearImport = () => { I.data = Array.from({ length: 30 }, blankRow); I.base = 0; I.baseLsx = ''; I.sel = new Set(); I.undo = []; setGk(k => k + 1); };
  const delLocal = () => {
    const b = I.base || 0;
    const keep = I.data.filter((_, i) => i < b || !I.sel.has(i));       // dòng của lệnh đã lưu không bị bỏ
    I.data = keep.length ? keep : [blankRow()]; I.sel = new Set(); I.undo = []; setGk(k => k + 1);
  };

  const dis = (b) => ({ disabled: b || !!busy, style: { opacity: (b || busy) ? .5 : 1 } });

  return (
    <div className="bk-root">
      <div className="no-print space-y-3 pb-3" style={{ flex: '0 0 auto' }}>
        <div className="card p-3 flex flex-wrap items-center gap-3">
          {mode === 'edit' ? (<>
            <button className="btn" onClick={() => setMode('import')}><i className="fa-solid fa-arrow-left"></i> Up Bom</button>
            <span className="text-xs font-bold text-slate-500 whitespace-nowrap shrink-0">Lệnh sản xuất</span>
            <input list="lsx-bk-list" value={input} onChange={e => { setInput(e.target.value); if (picked(e, lsxList)) search(e.target.value); }}
              onKeyDown={e => e.key === 'Enter' && search()}
              placeholder="Nhập hoặc chọn lệnh sản xuất…" className="inp" style={{ width: 280 }} />
            <datalist id="lsx-bk-list">{lsxList.map(l => <option key={l} value={l} />)}</datalist>
            <button className="btn btn-primary" onClick={() => search()}><i className="fa-solid fa-magnifying-glass"></i> Tìm</button>
            {E.loaded && <span className="text-xs text-slate-500">{E.data.length} dòng · <b className="text-amber-600">{E.dirty.size} dòng đã sửa</b> · <b className="text-red-600">{E.sel.size} dòng đang chọn</b></span>}
            <button className="btn btn-red ml-auto" onClick={deleteSel} {...dis(!E.sel.size || !can('bomkanban.delete'))}><i className="fa-solid fa-trash"></i> Xoá dòng đã chọn ({E.sel.size})</button>
            <button className="btn btn-green" onClick={saveEdit} {...dis(!E.dirty.size || !can('bomkanban.edit'))}><i className="fa-solid fa-floppy-disk"></i> Lưu thay đổi ({E.dirty.size})</button>
          </>) : (<>
            <button className="btn btn-primary" onClick={() => setMode('edit')}><i className="fa-solid fa-pen"></i> Sửa Bom</button>
            <span className="font-bold text-slate-700 text-sm">Up BOM Kanban</span>
            <span className="text-xs text-slate-500">{importFilled().length} dòng mới sẽ lưu · {I.sel.size} dòng đang chọn</span>
            <button className="btn ml-auto" onClick={() => setCfgOpen(true)}><i className="fa-solid fa-sliders"></i> Cấu hình</button>
            <button className="btn" onClick={delLocal} {...dis(!I.sel.size)}><i className="fa-solid fa-eraser"></i> Bỏ dòng đã chọn</button>
            <button className="btn" onClick={clearImport}>Xoá hết</button>
            <button className="btn btn-green" onClick={saveImport} {...dis(!importFilled().length || !can('bomkanban.up'))}><i className="fa-solid fa-floppy-disk"></i> Lưu vào Supabase</button>
          </>)}
        </div>
        <p className="text-xs text-gray-400 px-1">
          {mode === 'edit'
            ? 'Kéo chuột qua các ô để chọn vùng (Ctrl+D điền xuống · Ctrl+R điền sang phải) · gõ hoặc F2/nhấp đúp để sửa · Ctrl+C / V · Ctrl+Z hoàn tác · Delete xoá vùng · Chọn DÒNG: bấm hoặc kéo ở cột số thứ tự bên trái (đỏ nhạt).'
            : 'Các dòng xám ở trên là lệnh gần đây nhất đã lưu (chỉ đọc, không lưu lại). Bấm vào cột A của dòng đầu tiên bên dưới đường kẻ xanh rồi Ctrl+V để dán lệnh mới (cột A → FA). Ctrl+D / Ctrl+R điền xuống / sang phải · Cột A (Lệnh sản xuất) và B (STT) là bắt buộc.'}
        </p>
                {mode === 'import' && lastInfo && (() => {
          const { sb, sh, shErr } = lastInfo;
          const same = !!sh && sb.lsx === sh.lsx && sb.row === sh.row;
          const stale = sb.lsx !== (I.baseLsx || '') || sb.id !== (I.baseId || 0);
          return (
            <div className="card p-3 flex flex-wrap items-center gap-x-5 gap-y-2 text-sm">
              <span className="font-bold text-slate-700"><i className="fa-solid fa-flag-checkered text-blue-600 mr-1.5"></i>Lệnh cuối cùng</span>
              <span><i className="fa-solid fa-database text-slate-400 mr-1"></i>Supabase: <b className="text-blue-700">{sb.lsx || '—'}</b>
                {sb.lsx && <span className="text-xs text-slate-500"> · STT {sb.stt} · dòng {sb.row}</span>}</span>
              <span><i className="fa-solid fa-table text-slate-400 mr-1"></i>Google Sheet: {sh
                ? <><b className="text-green-700">{sh.lsx || '—'}</b>{sh.lsx && <span className="text-xs text-slate-500"> · STT {sh.stt} · dòng {sh.row}</span>}</>
                : <span className="text-xs text-amber-600">{shErr ? 'không đọc được (' + shErr + ')' : 'đang kiểm tra…'}</span>}</span>
              {sh && (same
                ? <span className="px-2 py-0.5 rounded-full text-xs font-bold bg-green-100 text-green-700"><i className="fa-solid fa-check"></i> Khớp</span>
                : <span className="px-2 py-0.5 rounded-full text-xs font-bold bg-amber-100 text-amber-700"><i className="fa-solid fa-triangle-exclamation"></i> Lệch giữa Supabase và Sheet, hãy kiểm tra đồng bộ</span>)}
              {stale && <button className="btn btn-primary ml-auto" onClick={loadLatestBtn}><i className="fa-solid fa-rotate"></i> Có lệnh mới, nạp lại</button>}
            </div>
          );
        })()}
        {busy && <div className="card p-3 text-sm text-blue-700 bg-blue-50">{busy}</div>}
      </div>

      <div style={{ flex: '1 1 auto', minHeight: 0, display: 'flex', flexDirection: 'column' }}>
        {mode === 'edit' && loading && <div className="card p-6 text-center text-gray-400">Đang tải…</div>}
        {mode === 'edit' && !loading && !E.loaded && <div className="card p-6 text-center text-gray-400">Nhập lệnh sản xuất rồi nhấn Enter để hiển thị dữ liệu cần sửa.</div>}
        {mode === 'edit' && !loading && E.loaded && !E.data.length && <div className="card p-6 text-center text-gray-400">Không tìm thấy lệnh sản xuất “{E.loaded}”.</div>}
        {mode === 'edit' && !loading && E.data.length > 0 && <SheetGrid key={'e' + gk} store={E} onChange={re} canAdd={false} locked={!can('bomkanban.edit')} />}
        {mode === 'import' && <button className="btn btn-primary" onClick={() => setMode('edit')} {...dis(!can('bomkanban.edit'))}><i className="fa-solid fa-pen"></i> Sửa Bom</button>
      </div>

            {cfgOpen && (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 no-print" onClick={() => setCfgOpen(false)}>
          <div className="bg-white p-6 rounded-2xl w-full max-w-md shadow-2xl" onClick={e => e.stopPropagation()}>
            <h2 className="text-lg font-bold mb-4"><i className="fa-solid fa-sliders text-primary mr-2"></i>Cấu hình Up BOM</h2>

            <p className="text-xs font-bold text-slate-500 mb-2">Số lệnh gần nhất hiển thị ở vùng xám</p>
            <div className="flex gap-2 mb-1">
              {[1, 2, 3, 4, 5].map(n => (
                <button key={n} className={'pill ' + (lastN === n ? 'on' : '')} onClick={() => pickLastN(n)} disabled={!!busy}>{n} lệnh</button>
              ))}
            </div>
            <p className="text-xs text-gray-400 mb-4">Chọn 2 sẽ hiện 2 lệnh cuối cùng trong Supabase (đồng bộ với Sheet), lệnh mới nhất nằm sát vùng dán. Mặc định 1 lệnh.</p>

            <p className="text-xs font-bold text-slate-500 mb-2">Cột hiển thị</p>
            <div className="mb-4">
              <button className="btn" onClick={e => { const b = e.currentTarget.getBoundingClientRect(); setColPop({ x: b.left, y: b.bottom + 4 }); }}>
                <i className="fa-solid fa-table-columns"></i> Chọn cột hiển thị{I.hidden.size ? ' (' + I.hidden.size + ' ẩn)' : ''}
              </button>
            </div>

            <p className="text-xs font-bold text-slate-500 mb-2">Thêm dòng trống</p>
            <button className="btn mb-6" onClick={addRows}><i className="fa-solid fa-plus"></i> Thêm 100 dòng</button>

            <div className="flex justify-end">
              <button className="btn btn-primary" onClick={() => setCfgOpen(false)}>Xong</button>
            </div>
          </div>
        </div>
      )}

      {colPop && <ColPickPop store={I} pos={colPop} onChange={re} onClose={() => setColPop(null)} />}

      {dlg && (
        <div className="no-print" onMouseDown={() => closeDlg(false)}
             style={{ position: 'fixed', inset: 0, zIndex: 100, display: 'flex', alignItems: 'center', justifyContent: 'center',
                      background: 'rgba(15,23,42,.55)', backdropFilter: 'blur(3px)' }}>
          <div className="dlg" onMouseDown={e => e.stopPropagation()}>
            <div className={'dlg-ico ' + (dlg.danger ? 'red' : 'blue')}><i className={'fa-solid ' + (dlg.icon || 'fa-circle-question')}></i></div>
            <h3 className="dlg-title">{dlg.title}</h3>
            <p className="dlg-msg">{dlg.message}</p>
            {dlg.chips && <div className="dlg-chips">{dlg.chips.map((c, i) => <span key={i} className="dlg-chip">{c}</span>)}</div>}
            {dlg.options && (
              <div style={{ marginTop: 16, textAlign: 'left', display: 'grid', gap: 8 }}>
                {dlg.options.map(o => (
                  <div key={o.v} className={'dlg-opt' + (pick === o.v ? ' on' : '')} onClick={() => setPick(o.v)}>
                    <span className="dlg-radio"></span>
                    <span><b>{o.label}</b><small>{o.desc}</small></span>
                  </div>
                ))}
              </div>
            )}
            {dlg.warn && <div className="dlg-warn"><i className="fa-solid fa-triangle-exclamation"></i> {dlg.warn}</div>}
            <div className="dlg-act">
              <button className="btn" onClick={() => closeDlg(false)}>Hủy</button>
              <button className={'btn ' + (dlg.danger ? 'btn-red' : 'btn-primary')} autoFocus onClick={() => closeDlg(true)}>{dlg.confirmText || 'Đồng ý'}</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// =====================================================================
// 7C. BOM ĐƠN HÀNG — tra cứu chi tiết theo lệnh sản xuất (nguồn: Bomkanban), bôi đen / copy được
// =====================================================================
// 6 cột xưởng Gia Công Cắt Gọt (mã cột trong sheet BOM TỔNG VÀO)
const BD_PROC6 = [['BC', 'Đúc nhôm'], ['BD', 'Cưa vòng'], ['BE', 'Tiện'], ['BF', 'Phay'], ['BG', 'Nguội'], ['BH', 'Nhiệt']];
const BD_SIX = new Set(BD_PROC6.map(x => x[0]));
const BD_OTHERS = PROC_COLS.filter(([L]) => !BD_SIX.has(L));
// Tách số công đoạn: "2;6" / "2,6" / "2.6" -> [2, 6]
const bdSteps = (v) => { const a = []; String(v == null ? '' : v).split(/[;,.]/).forEach(p => { const n = parseInt(p.trim(), 10); if (n > 0) a.push(n); }); return a; };

// Công đoạn trước / sau của 1 chi tiết
function bdProc(r) {
  const own = [];
  BD_PROC6.forEach(([L, label]) => bdSteps(cell(r, L)).forEach(n => own.push({ label, n })));
  if (!own.length) return { before: '', after: '' };
  const find = (n) => BD_OTHERS.filter(([L]) => bdSteps(cell(r, L)).includes(n)).map(x => x[1]).join(' / ');
  const min = Math.min(...own.map(s => s.n)), max = Math.max(...own.map(s => s.n));
  const before = min === 1
    ? Array.from(new Set(own.filter(s => s.n === 1).map(s => s.label))).join(' / ')   // xưởng có công đoạn 1 -> lấy luôn tên cột đó
    : find(min - 1);                                                                   // không thì lấy (số nhỏ nhất - 1) ở các cột còn lại
  const after = find(max + 1);                                                         // (số lớn nhất + 1) ở các cột còn lại
  return { before, after };
}

// Thứ tự cột như hình 2. g(r, x): x = { khgh, p: { before, after } }
const BD_COLS = [
  { h: 'KHGH', w: 100, ctr: 1, g: (r, x) => x.khgh },
  { h: 'LSX', w: 120, ctr: 1, key: 1, g: r => cell(r, 'A') },
  { h: 'Sản phẩm', w: 220, wr: 1, g: (r, x) => x.sp },
  { h: 'STT', w: 60, ctr: 1, g: r => cell(r, 'B') },
  { h: 'MSCT', w: 130, g: r => cell(r, 'Q') },
  { h: 'Tên chi tiết', w: 230, wr: 1, g: r => cell(r, 'R') },
  { h: 'Vật liệu', w: 90, ctr: 1, g: r => cell(r, 'U') },
  { h: 'Dài', grp: 'q', w: 70, ctr: 1, g: r => cell(r, 'AB') },
  { h: 'Rộng', grp: 'q', w: 70, ctr: 1, g: r => cell(r, 'AC') },
  { h: 'Dày', grp: 'q', w: 70, ctr: 1, g: r => cell(r, 'AD') },
  { h: 'Hình/hộp', grp: 'q', w: 90, ctr: 1, g: r => cell(r, 'AE') },
  { h: 'Dn', grp: 'q', w: 70, ctr: 1, g: r => cell(r, 'AF') },
  { h: 'Dt', grp: 'q', w: 70, ctr: 1, g: r => cell(r, 'AG') },
  { h: 'SL/bộ', w: 70, ctr: 1, g: r => cell(r, 'AI') },
  { h: 'SL/ĐH', w: 70, ctr: 1, key: 1, g: r => cell(r, 'AJ') },
  { h: 'Khối lượng', w: 90, ctr: 1, g: r => cell(r, 'AM') },
  { h: 'Công đoạn trước', w: 130, ctr: 1, g: (r, x) => x.p.before },
  ...BD_PROC6.map(([L, label]) => ({ h: label, grp: 'x', w: 70, ctr: 1, g: r => cell(r, L) })),
  { h: 'Công đoạn sau', w: 130, ctr: 1, g: (r, x) => x.p.after },
  { h: 'Ghi chú ĐMVT', w: 260, wr: 1, g: r => cell(r, 'EZ') },
];
const BD_GROUPS = { q: 'QUY CÁCH CHI TIẾT (mm)', x: 'XƯỞNG GIA CÔNG CẮT GỌT' };
// Độ rộng cột mặc định (px) ở cỡ chữ 20 — đúng thứ tự BD_COLS (25 cột)
const BD_W20 = [130, 160, 300, 70, 170, 320, 110,  90, 90, 90, 120, 90, 90,  90, 90, 120,  170,  95, 95, 95, 95, 95, 95,  170,  340];

const BD_W = BD_W20.map(w => Math.round(w * 1.6));   // độ rộng mặc định ở cỡ chữ 32

// Tách nhiều lệnh sản xuất: ngăn cách bằng xuống dòng, tab, dấu phẩy, chấm phẩy hoặc khoảng trắng
const parseLsx = (s) => Array.from(new Set(String(s || '').split(/[\s,;]+/).map(x => x.trim()).filter(Boolean)));

// Khi sao chép: ngày dd/mm/yyyy -> yyyy-mm-dd (Google Sheet / Excel hiểu đúng ở mọi ngôn ngữ), chỉ áp dụng cột KHGH (cột 0)
const bdOut = (ci, v) => {
  if (ci !== 0 || !/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(v)) return v;
  const [d, m, y] = v.split('/');
  return y + '-' + m.padStart(2, '0') + '-' + d.padStart(2, '0');
};

function BomDonHang({ active }) {
  const lsxList = useLsxList(active);
  const [input, setInput] = useState('');
  const [lsx, setLsx] = useState('');
  const [rows, setRows] = useState([]);
  const [pkh, setPkh] = useState({});
  const [loading, setLoading] = useState(false);
  const [quick, setQuick] = useState('');
  const [copied, setCopied] = useState(false);
  const [flt, setFlt] = useState({});            // bộ lọc theo cột { chỉ số cột: Set giá trị giữ lại }
  const [srt, setSrt] = useState(null);          // { c, dir }
  const [pop, setPop] = useState(null);          // hộp lọc đang mở { c, x, y }
  const [rng, setRng] = useState(null);          // vùng ô đang chọn { ar, ac, br, bc }
  const [boxW, setBoxW] = useState(0);
  const [frozenZ, setFrozenZ] = useState(null);  // đang kéo cột thì giữ nguyên tỉ lệ zoom cho khỏi "trượt"
  const boxRef = useRef(null), dragRef = useRef(false);

  // ---- Cỡ chữ cố định 32px, luôn vừa bề ngang; độ rộng cột kéo dãn được và được nhớ lại ----
  const fs = 32;
  const [colW, setColW] = useState(() => {
    try { const a = JSON.parse(localStorage.getItem('bd_colw_v2')); if (Array.isArray(a) && a.length === BD_COLS.length) return a; } catch (e) {}
    return BD_W;
  });
  useEffect(() => { try { localStorage.setItem('bd_colw_v2', JSON.stringify(colW)); } catch (e) {} }, [colW]);

  // ---- Tải dữ liệu ----
  const load = async (value) => {
    const list = parseLsx(value);
    if (!list.length) { setRows([]); return; }
    setLoading(true);
    try {
      let data;
      if (list.length === 1) {
        const v = list[0];
        data = await fetchAll(() => supabase.from(TB_KANBAN).select('*').eq('col_a', v).order('sheet_row'));
        if (!data.length) data = await fetchAll(() => supabase.from(TB_KANBAN).select('*').ilike('col_a', `%${v}%`).order('sheet_row'));
      } else {
        data = [];
        for (let i = 0; i < list.length; i += 40) {                 // chia lô 40 lệnh để link truy vấn không quá dài
          const part = list.slice(i, i + 40);
          data = data.concat(await fetchAll(() => supabase.from(TB_KANBAN).select('*').in('col_a', part).order('sheet_row')));
        }
        const ord = new Map(list.map((k, i) => [normKey(k), i]));    // xếp theo đúng thứ tự đã nhập, trong mỗi lệnh theo số dòng Sheet
        data.sort((a, b) => (ord.get(normKey(a.col_a)) ?? 9999) - (ord.get(normKey(b.col_a)) ?? 9999) || (a.sheet_row || 0) - (b.sheet_row || 0));
        const found = new Set(data.map(d => normKey(d.col_a)));
        const miss = list.filter(k => !found.has(normKey(k)));
        if (miss.length) alert('Không tìm thấy ' + miss.length + ' lệnh: ' + miss.slice(0, 10).join(', ') + (miss.length > 10 ? '…' : ''));
      }
      setRows(data);
      // KHGH = Ngày hoàn thành trong bảng LSX_PKH (cùng nguồn với ô KH GH của tab In đơn hàng)
      try {
        const keys = Array.from(new Set(data.map(d => String(d.col_a || '').trim()).filter(Boolean)));
        const m = {};
        if (keys.length) {
          const { data: p, error } = await supabase.from(TB_PKH).select('lsx, ngay_hoan_thanh, ten_don_hang').in('lsx', keys);
          if (error) throw error;
          (p || []).forEach(x => { const k = normKey(x.lsx); if (!m[k]) m[k] = { khgh: x.ngay_hoan_thanh ? String(x.ngay_hoan_thanh) : '', ten: x.ten_don_hang ? String(x.ten_don_hang) : '' }; });
        }
        setPkh(m);
      } catch (e2) { console.error('LSX_PKH:', e2); setPkh({}); }
    } catch (e) { alert('Lỗi tải dữ liệu: ' + e.message); }
    setLoading(false);
  };
  // Enter / bấm Tìm / chọn gợi ý đều gọi hàm này
  const search = (val) => {
    const v = (typeof val === 'string' ? val : input).trim(); if (!v) return;
    setFlt({}); setSrt(null); setLsx(v); load(v);
  };
  useEffect(() => { if (active && lsx) load(lsx); }, [active]);      // quay lại tab thì tải lại dữ liệu mới nhất

  const data = useMemo(() => rows.map(r => {
    const info = pkh[normKey(cell(r, 'A'))] || {};
    const x = { khgh: info.khgh || '', sp: info.ten || '', p: bdProc(r) };
    return BD_COLS.map(c => String(c.g(r, x) == null ? '' : c.g(r, x)));
  }), [rows, pkh]);
  const view = useMemo(() => data.map(a => ({ v: a })), [data]);       // ColFilterPop đọc x.v[cột]
  const shown = useMemo(() => {
    let a = data.filter(r => Object.keys(flt).every(c => flt[c].has(r[c])));
    if (srt) a = a.slice().sort((p, q) => srt.dir * p[srt.c].localeCompare(q[srt.c], 'vi', { numeric: true }));
    return a;
  }, [data, flt, srt]);
  const applyFlt = (c, s) => setFlt(p => { const n = { ...p }; if (s) n[c] = s; else delete n[c]; return n; });
  const nFlt = Object.keys(flt).length;

  // ---- Zoom (chỉ khi bật "Vừa bề ngang") ----
  const total = colW.reduce((a, b) => a + b, 0);
  useEffect(() => {
    const el = boxRef.current; if (!el) return;
    const m = () => { const w = el.clientWidth; if (w > 0) setBoxW(w); };
    m();
    const ro = new ResizeObserver(m); ro.observe(el);
    return () => ro.disconnect();
  }, []);
  const bz0 = boxW ? Math.floor(Math.min(1.4, (boxW - 4) / total) * 1000) / 1000 : 1;
  const bz = frozenZ || bz0;

  // ---- Kéo dãn cột ----
  const startResize = (e, i) => {
    e.preventDefault(); e.stopPropagation();
    const x0 = e.clientX, w0 = colW[i], z = bz0 || 1;
    setFrozenZ(z);
    document.body.style.cursor = 'col-resize';
    const mv = (ev) => {
      const w = Math.max(40, Math.round(w0 + (ev.clientX - x0) / z));
      setColW(p => { const a = p.slice(); a[i] = w; return a; });
    };
    const up = () => {
      window.removeEventListener('mousemove', mv); window.removeEventListener('mouseup', up);
      document.body.style.cursor = ''; setFrozenZ(null);
    };
    window.addEventListener('mousemove', mv); window.addEventListener('mouseup', up);
  };

  // ---- Sao chép ----
  const copyAll = async () => {
    const rowsOut = R ? shown.slice(R.r1, R.r2 + 1).map(a => a.slice(R.c1, R.c2 + 1)) : shown;   // có vùng chọn thì chỉ chép vùng đó
    const c0 = R ? R.c1 : 0;
    const text = rowsOut.map(a => a.map((v, j) => tsvQ(bdOut(c0 + j, v))).join('\t')).join('\n');   // không chép hàng tiêu đề
    try { await navigator.clipboard.writeText(text); }
    catch (e) { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
    setCopied(true); setTimeout(() => setCopied(false), 1800);
  };
  const selectTable = () => {
    if (!shown.length) return;
    setRng({ ar: 0, ac: 0, br: shown.length - 1, bc: BD_COLS.length - 1 });
    if (boxRef.current) boxRef.current.focus({ preventScroll: true });
  };
  const nGrp = (g) => BD_COLS.filter(c => c.grp === g).length;

  // ---- Chọn vùng ô kiểu Excel: bấm / kéo / Shift+bấm, Ctrl+A, Ctrl+C ----
    useEffect(() => { setRng(null); }, [data, flt, srt]);
  useEffect(() => {
    const up = () => { dragRef.current = false; };
    window.addEventListener('mouseup', up);
    return () => window.removeEventListener('mouseup', up);
  }, []);
  const R = rng ? { r1: Math.min(rng.ar, rng.br), r2: Math.max(rng.ar, rng.br), c1: Math.min(rng.ac, rng.bc), c2: Math.max(rng.ac, rng.bc) } : null;
  const cDown = (e, r, c) => {
    if (e.button !== 0) return;
    e.preventDefault();
    if (boxRef.current) boxRef.current.focus({ preventScroll: true });
    dragRef.current = true;
    setRng(p => (e.shiftKey && p) ? { ...p, br: r, bc: c } : { ar: r, ac: c, br: r, bc: c });
  };
  const cEnter = (r, c) => { if (dragRef.current) setRng(p => p ? { ...p, br: r, bc: c } : p); };
  const onBoxMove = (e) => {                             // kéo sát mép thì tự cuộn
    if (!dragRef.current) return;
    const el = boxRef.current, rc = el.getBoundingClientRect();
    if (e.clientY > rc.bottom - 30) el.scrollTop += 20; else if (e.clientY < rc.top + 100) el.scrollTop -= 20;
    if (e.clientX > rc.right - 30) el.scrollLeft += 30; else if (e.clientX < rc.left + 30) el.scrollLeft -= 30;
  };
  const onBoxCopy = (e) => {
    if (!R) return;
    const text = shown.slice(R.r1, R.r2 + 1).map(a => a.slice(R.c1, R.c2 + 1).map((v, j) => tsvQ(bdOut(R.c1 + j, v))).join('\t')).join('\n');
    e.clipboardData.setData('text/plain', text); e.preventDefault();
    setCopied(true); setTimeout(() => setCopied(false), 1500);
  };
  const onBoxKey = (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a') { e.preventDefault(); selectTable(); }
    else if (e.key === 'Escape') setRng(null);
  };

  // ---- Nút lọc + tay nắm kéo cột trong tiêu đề ----
  const sm = (i) => srt && srt.c === i ? (srt.dir > 0 ? ' ▲' : ' ▼') : '';
  const hTools = (i) => (<>
    <button className={'bd-flt' + (flt[i] ? ' on' : '')} title="Lọc / sắp xếp" onMouseDown={e => e.stopPropagation()}
      onClick={e => { const b = e.currentTarget.getBoundingClientRect(); setPop({ c: i, x: b.left, y: b.bottom + 4 }); }}>
      <i className="fa-solid fa-filter"></i>
    </button>
    <span className="bd-rs" title="Kéo để chỉnh độ rộng · nhấp đúp để đặt lại cột này" onMouseDown={e => startResize(e, i)}
      onDoubleClick={() => setColW(p => { const a = p.slice(); a[i] = BD_W[i]; return a; })} />
  </>);

  return (
    <div className="bd-root">
      <div className="card p-3 flex flex-wrap items-center gap-3" style={{ flex: '0 0 auto' }}>
        <span className="text-xs font-bold text-slate-500">Lệnh sản xuất</span>
        <input list="lsx-bd-list" value={input}
          onChange={e => { setInput(e.target.value); if (picked(e, lsxList)) search(e.target.value); }}
          onKeyDown={e => e.key === 'Enter' && search()}
          onPaste={e => {                                   // dán nhiều dòng từ Sheet/Excel -> gom thành 1 dãy và tìm luôn
            const t = e.clipboardData.getData('text');
            if (/[\r\n\t]/.test(t)) {
              e.preventDefault();
              const l = parseLsx(t).join(', ');
              setInput(l); if (l) search(l);
            }
          }}
          title="Có thể dán nhiều lệnh (mỗi lệnh 1 dòng, hoặc cách nhau bằng dấu phẩy)"
          placeholder="Nhập / dán 1 hoặc nhiều lệnh sản xuất…" className="inp" style={{ width: 420 }} />
        <datalist id="lsx-bd-list">{lsxList.map(l => <option key={l} value={l} />)}</datalist>
        <button className="btn btn-primary" onClick={() => search()}><i className="fa-solid fa-magnifying-glass"></i> Tìm</button>
        <button className="btn" onClick={() => load(lsx)} disabled={!lsx}><i className="fa-solid fa-rotate"></i> Làm mới</button>
        <span className="text-xs text-slate-500">{lsx ? shown.length + ' / ' + data.length + ' chi tiết' : ''}</span>
        {R && <span className="text-xs font-semibold text-blue-700">Đang chọn {(R.r2 - R.r1 + 1) * (R.c2 - R.c1 + 1)} ô · Ctrl+C để sao chép</span>}

        <div className="ml-auto"></div>
        {(nFlt > 0 || srt) && <button className="btn" onClick={() => { setFlt({}); setSrt(null); }}><i className="fa-solid fa-filter-circle-xmark"></i> Xoá lọc ({nFlt})</button>}
        <button className="btn" onClick={selectTable} disabled={!shown.length}><i className="fa-solid fa-object-group"></i> Chọn cả bảng</button>
        <button className="btn btn-green" onClick={copyAll} disabled={!shown.length}>
          <i className={'fa-solid ' + (copied ? 'fa-check' : 'fa-copy')}></i> {copied ? 'Đã sao chép' : 'Sao chép bảng'}
        </button>
      </div>

      <p className="text-xs text-gray-400 px-1" style={{ flex: '0 0 auto' }}>
        Nhập hoặc chọn lệnh trong gợi ý là tự tìm · Bấm / kéo chuột qua các ô để chọn vùng (Shift+bấm để mở rộng) · Ctrl+C sao chép, dán thẳng vào Excel / Google Sheet · Ctrl+A chọn cả bảng · Esc bỏ chọn ·
        Bấm biểu tượng phễu ở tiêu đề để lọc / sắp xếp cột · Kéo mép phải tiêu đề cột để chỉnh độ rộng (nhấp đúp để đặt lại).
      </p>

      <div className="card bd-box" ref={boxRef} tabIndex={0}
           style={{ flex: '1 1 auto', minHeight: 0, '--bdfs': fs + 'px', '--bdh': Math.round(fs * 1.9) + 'px' }}
           onCopy={onBoxCopy} onKeyDown={onBoxKey} onMouseMove={onBoxMove}>
        <div className="bd-zoom" style={{ '--bz': bz }}>
        <table className="erp bd" style={{ width: total }}>
          <colgroup>{colW.map((w, i) => <col key={i} style={{ width: w }} />)}</colgroup>
          <thead>
            <tr>
              {BD_COLS.map((c, i) => {
                if (c.grp) {
                  if (BD_COLS.findIndex(z => z.grp === c.grp) !== i) return null;
                  return <th key={i} colSpan={nGrp(c.grp)}>{BD_GROUPS[c.grp]}</th>;
                }
                return <th key={i} rowSpan={2}>{c.h}{sm(i)}{hTools(i)}</th>;
              })}
            </tr>
            <tr className="sub">
              {BD_COLS.map((c, i) => c.grp ? <th key={i}>{c.h}{sm(i)}{hTools(i)}</th> : null)}
            </tr>
          </thead>
          <tbody>
            {loading ? (
              <tr><td colSpan={BD_COLS.length} className="text-center py-8 text-gray-400">Đang tải…</td></tr>
            ) : !lsx ? (
              <tr><td colSpan={BD_COLS.length} className="text-center py-8 text-gray-400">Nhập hoặc chọn lệnh sản xuất để xem BOM đơn hàng.</td></tr>
            ) : shown.length === 0 ? (
              <tr><td colSpan={BD_COLS.length} className="text-center py-8 text-gray-400">Không tìm thấy dữ liệu.</td></tr>
            ) : shown.map((a, ri) => (
              <tr key={ri}>
                {a.map((v, ci) => {
                  const c = BD_COLS[ci];
                  const inR = R && ri >= R.r1 && ri <= R.r2 && ci >= R.c1 && ci <= R.c2;
                  let sh;
                  if (inR) {                                   // viền xanh bao quanh vùng chọn
                    const s = [];
                    if (ri === R.r1) s.push('inset 0 2px 0 #2563eb');
                    if (ri === R.r2) s.push('inset 0 -2px 0 #2563eb');
                    if (ci === R.c1) s.push('inset 2px 0 0 #2563eb');
                    if (ci === R.c2) s.push('inset -2px 0 0 #2563eb');
                    sh = s.join(',');
                  }
                  return <td key={ci} className={(c.key ? 'key ' : '') + (c.ctr ? 'ctr ' : '') + (c.wr ? 'wr ' : '') + (inR ? 'bsel' : '')}
                             style={sh ? { boxShadow: sh } : undefined}
                             onMouseDown={e => cDown(e, ri, ci)} onMouseEnter={() => cEnter(ri, ci)}>{v}</td>;
                })}
              </tr>
            ))}
          </tbody>
        </table>
        </div>
      </div>

      {pop && <ColFilterPop pop={pop} view={view} cur={flt[pop.c]} onApply={applyFlt}
              onSort={(c, d) => { setSrt({ c, dir: d }); setPop(null); }} onClose={() => setPop(null)} />}
    </div>
  );
}

// =====================================================================
// 8. PHÂN QUYỀN — danh sách người dùng/vai trò thủ công (bảng "NguoiDung")
// =====================================================================
// Danh sách quyền: [mã quyền, tên hiển thị]. Muốn thêm quyền mới chỉ cần thêm vào đây rồi dùng can('mã quyền') ở chỗ cần chặn.
const PERM_GROUPS = [
  { title: 'Xem menu', items: [
    ['menu.dashboard', 'Dashboard'], ['menu.bom', 'Tiến độ chung'], ['menu.tracuu', 'Tổng hợp đơn hàng'],
    ['menu.indonhang', 'In đơn hàng'], ['menu.kanban', 'Kanban'], ['menu.bomkanban', 'BOM Kanban'],
    ['menu.bomdonhang', 'BOM Đơn hàng'], ['menu.phanquyen', 'Phân quyền (chỉ xem)'] ] },
  { title: 'Tiến độ chung', items: [['bom.import', 'Nhập BOM từ CSV']] },
  { title: 'Tổng hợp đơn hàng', items: [['tracuu.tick', 'Tick Nhận vật tư / Giao hàng / GCN']] },
  { title: 'In đơn hàng', items: [['indonhang.print', 'In đơn hàng'], ['indonhang.bus', 'Dùng mẫu In ĐH BUS']] },
  { title: 'Kanban', items: [['kanban.print', 'In tem Kanban']] },
  { title: 'BOM Kanban', items: [
    ['bomkanban.up', 'Up BOM (dán và lưu lệnh mới)'],
    ['bomkanban.edit', 'Sửa BOM (chế độ Sửa Bom và lưu)'],
    ['bomkanban.delete', 'Xoá dòng BOM (cần kèm quyền Sửa BOM)'] ] },
];

function Switch({ on, onChange, disabled }) {
  return <button type="button" className={'sw' + (on ? ' on' : '')} disabled={disabled} onClick={onChange} aria-pressed={on}></button>;
}

function PhanQuyen() {
  const { user: me, token } = useAuth();
  const isAdmin = me.role === 'admin';
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(isAdmin);
  const [selId, setSelId] = useState(me.id);
  const [modal, setModal] = useState(null);                 // { mode: 'new' | 'name' | 'pass' | 'del', user }
  const [fm, setFm] = useState({ username: '', name: '', pass: '', role: 'user' });
  const [saving, setSaving] = useState(false);
  const queue = useRef(Promise.resolve());

  const list = isAdmin ? users : [me];
  const cur = list.find(x => x.id === selId) || list[0];
  const has = (u, k) => u.role === 'admin' || !!(u.perms && u.perms[k]);
  const editable = isAdmin && cur && cur.role !== 'admin';

  const load = async (pick) => {
    if (!isAdmin) return;
    setLoading(true);
    const { data, error } = await supabase.rpc('app_users_list', { p_token: token });
    if (error) notify('error', 'Không tải được danh sách', error.message);
    else { setUsers(data || []); setSelId(id => pick || ((data || []).some(x => x.id === id) ? id : (data && data[0] ? data[0].id : id))); }
    setLoading(false);
  };
  useEffect(() => { load(); }, [isAdmin]);

  const patchLocal = (id, patch) => setUsers(p => p.map(x => x.id === id ? { ...x, ...patch } : x));
  // Lưu quyền theo hàng đợi: bấm nhanh nhiều công tắc vẫn lưu đúng thứ tự
  const savePerms = (u, perms) => {
    queue.current = queue.current.then(async () => {
      const { error } = await supabase.rpc('app_user_update', { p_token: token, p_id: u.id, p_perms: perms });
      if (error) { notify('error', 'Không lưu được quyền', error.message); load(); }
    });
  };
  const toggle = (u, k) => {
    if (!editable) return;
    const perms = { ...(u.perms || {}) };
    if (perms[k]) delete perms[k]; else perms[k] = true;
    patchLocal(u.id, { perms }); savePerms(u, perms);
  };
  const setGroup = (u, g, val) => {
    if (!editable) return;
    const perms = { ...(u.perms || {}) };
    g.items.forEach(([k]) => { if (val) perms[k] = true; else delete perms[k]; });
    patchLocal(u.id, { perms }); savePerms(u, perms);
  };
  const changeRole = async (u, role) => {
    const { data, error } = await supabase.rpc('app_user_update', { p_token: token, p_id: u.id, p_role: role });
    if (error) return notify('error', 'Không đổi được vai trò', error.message);
    patchLocal(u.id, data);
  };
  const toggleActive = async (u) => {
    const { data, error } = await supabase.rpc('app_user_update', { p_token: token, p_id: u.id, p_active: !u.active });
    if (error) return notify('error', 'Không thực hiện được', error.message);
    patchLocal(u.id, data);
    notify('success', u.active ? 'Đã khoá tài khoản' : 'Đã mở khoá tài khoản', u.username);
  };

  const openModal = (mode, user) => { setFm({ username: '', name: user ? (user.full_name || '') : '', pass: '', role: 'user' }); setModal({ mode, user }); };
  const submitModal = async () => {
    setSaving(true);
    try {
      let r;
      if (modal.mode === 'new') r = await supabase.rpc('app_user_create', { p_token: token, p_username: fm.username, p_full_name: fm.name, p_pass: fm.pass, p_role: fm.role });
      else if (modal.mode === 'name') r = await supabase.rpc('app_user_update', { p_token: token, p_id: modal.user.id, p_full_name: fm.name });
      else if (modal.mode === 'pass') r = await supabase.rpc('app_user_setpass', { p_token: token, p_id: modal.user.id, p_new: fm.pass });
      else r = await supabase.rpc('app_user_delete', { p_token: token, p_id: modal.user.id });
      if (r.error) throw new Error(r.error.message);
      const msg = { new: 'Đã tạo tài khoản', name: 'Đã đổi tên', pass: 'Đã đổi mật khẩu', del: 'Đã xoá tài khoản' }[modal.mode];
      notify('success', msg, modal.mode === 'new' ? fm.username : modal.user && modal.user.username);
      const mode = modal.mode; setModal(null);
      await load(mode === 'new' && r.data ? r.data.id : (mode === 'del' ? me.id : undefined));
    } catch (e) { notify('error', 'Không thực hiện được', e.message || String(e)); }
    setSaving(false);
  };
  const titleOf = { new: 'Thêm tài khoản', name: 'Sửa tên hiển thị', pass: 'Đổi mật khẩu', del: 'Xoá tài khoản' };

  return (
    <div style={{ display: 'flex', gap: 16, alignItems: 'flex-start', height: 'calc(100vh - 96px)' }}>
      {/* Danh sách tài khoản */}
      <div className="card" style={{ width: 280, flex: '0 0 280px', height: '100%', display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
        <div className="p-3 flex items-center gap-2" style={{ borderBottom: '1px solid #e5ebf3' }}>
          <b className="text-sm text-slate-700">Tài khoản</b>
          {isAdmin && <button className="btn btn-primary ml-auto" onClick={() => openModal('new')}><i className="fa-solid fa-user-plus"></i> Thêm</button>}
        </div>
        <div style={{ overflowY: 'auto', flex: 1 }}>
          {loading ? <p className="p-4 text-sm text-gray-400">Đang tải…</p> : list.map(u => (
            <div key={u.id} className={'pq-user' + (cur && cur.id === u.id ? ' on' : '')} onClick={() => setSelId(u.id)}>
              <div className="font-bold text-sm text-slate-800">{u.full_name || u.username}</div>
              <div className="text-xs text-slate-500">{u.username} · {u.role === 'admin' ? 'Admin' : 'Người dùng'}{!u.active ? ' · Đã khoá' : ''}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Quyền chi tiết */}
      <div className="card" style={{ flex: 1, minWidth: 0, height: '100%', overflowY: 'auto', padding: 18 }}>
        {cur && (<>
          <div className="flex flex-wrap items-start gap-3 mb-3">
            <div>
              <div className="text-lg font-extrabold text-slate-800">{cur.full_name || cur.username}</div>
              <div className="text-xs text-slate-500">{cur.username} · {cur.role === 'admin' ? 'Admin' : 'Người dùng'} · {cur.active ? 'Đang dùng' : 'Đã khoá'}{cur.id === me.id ? ' · Bạn' : ''}</div>
            </div>
            {isAdmin && (
              <div className="flex flex-wrap items-center gap-2 ml-auto">
                <select className="inp" value={cur.role} disabled={cur.id === me.id} onChange={e => changeRole(cur, e.target.value)} style={{ padding: '6px 8px', fontSize: 12 }}>
                  <option value="user">Người dùng</option><option value="admin">Admin</option>
                </select>
                <button className="btn" onClick={() => openModal('name', cur)}>Sửa tên</button>
                <button className="btn" onClick={() => openModal('pass', cur)}>Đổi MK</button>
                {cur.id !== me.id && <button className="btn" onClick={() => toggleActive(cur)}>{cur.active ? 'Khoá' : 'Mở khoá'}</button>}
                {cur.id !== me.id && <button className="btn btn-red" onClick={() => openModal('del', cur)}>Xoá</button>}
              </div>
            )}
          </div>
          {cur.role === 'admin' && <p className="text-xs text-slate-500 mb-3">Admin luôn có toàn quyền.</p>}
          {!isAdmin && <p className="text-xs text-amber-600 mb-3">Bạn chỉ có quyền xem. Chỉ Admin mới thay đổi được phân quyền.</p>}

          <div className="space-y-3">
            {PERM_GROUPS.map(g => (
              <div className="pq-box" key={g.title}>
                <div className="flex items-center gap-3">
                  <h4>{g.title}</h4>
                  {editable && g.items.length > 1 && (<>
                    <button className="text-xs font-semibold text-primary ml-auto" onClick={() => setGroup(cur, g, true)}>Bật hết</button>
                    <button className="text-xs font-semibold text-slate-500" onClick={() => setGroup(cur, g, false)}>Tắt hết</button>
                  </>)}
                </div>
                <div className="pq-grid">
                  {g.items.map(([k, label]) => (
                    <div className="pq-row" key={k}>
                      <Switch on={has(cur, k)} disabled={!editable} onChange={() => toggle(cur, k)} />
                      <span>{label}</span>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </>)}
      </div>

      {modal && (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" onMouseDown={() => setModal(null)}>
          <div className="bg-white p-6 rounded-2xl w-full max-w-sm shadow-2xl" onMouseDown={e => e.stopPropagation()}>
            <h2 className="text-lg font-bold mb-4">{titleOf[modal.mode]}</h2>
            <div className="space-y-3">
              {modal.mode === 'new' && (<>
                <input className="inp w-full" placeholder="Tên đăng nhập (viết liền, tối thiểu 3 ký tự)" value={fm.username} onChange={e => setFm({ ...fm, username: e.target.value })} autoFocus />
                <input className="inp w-full" placeholder="Họ tên hiển thị" value={fm.name} onChange={e => setFm({ ...fm, name: e.target.value })} />
                <input className="inp w-full" type="password" placeholder="Mật khẩu (tối thiểu 6 ký tự)" value={fm.pass} onChange={e => setFm({ ...fm, pass: e.target.value })} />
                <select className="inp w-full" value={fm.role} onChange={e => setFm({ ...fm, role: e.target.value })}>
                  <option value="user">Người dùng</option><option value="admin">Admin</option>
                </select>
              </>)}
              {modal.mode === 'name' && <input className="inp w-full" placeholder="Họ tên hiển thị" value={fm.name} onChange={e => setFm({ ...fm, name: e.target.value })} autoFocus />}
              {modal.mode === 'pass' && <input className="inp w-full" type="password" placeholder="Mật khẩu mới (tối thiểu 6 ký tự)" value={fm.pass} onChange={e => setFm({ ...fm, pass: e.target.value })} autoFocus />}
              {modal.mode === 'del' && <p className="text-sm text-slate-600">Xoá tài khoản <b>{modal.user.username}</b>? Thao tác này không thể hoàn tác.</p>}
            </div>
            <div className="flex justify-end gap-3 mt-5">
              <button className="btn" onClick={() => setModal(null)}>Hủy</button>
              <button className={'btn ' + (modal.mode === 'del' ? 'btn-red' : 'btn-primary')} disabled={saving} onClick={submitModal}>{saving ? 'Đang lưu…' : (modal.mode === 'del' ? 'Xoá' : 'Lưu')}</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// =====================================================================
// 9. SIDEBAR (kiểu hình 1, dài hết màn hình, có nút thu/mở) + LAYOUT
// =====================================================================
const MENU = [
  { group: 'Tổng hợp', icon: 'fa-chart-pie', items: [
    { id: 'dashboard', name: 'Dashboard', icon: 'fa-gauge-high' } ] },
  { group: 'Theo dõi sản xuất', icon: 'fa-chart-column', items: [
    { id: 'bom', name: 'Tiến độ chung', icon: 'fa-cubes' },
    { id: 'tracuu', name: 'Tổng hợp đơn hàng', icon: 'fa-table-list', badge: 'tracuu' } ] },
  { group: 'Đơn hàng', icon: 'fa-clipboard-list', items: [
    { id: 'indonhang', name: 'In đơn hàng', icon: 'fa-print' },
    { id: 'kanban', name: 'Kanban', icon: 'fa-tags', badge: 'kanban' },
    { id: 'bomkanban', name: 'BOM Kanban', icon: 'fa-table-cells' },
    { id: 'bomdonhang', name: 'BOM Đơn hàng', icon: 'fa-list-check' } ] },
  { group: 'Hệ thống', icon: 'fa-gear', items: [
    { id: 'phanquyen', name: 'Phân quyền', icon: 'fa-user-shield' } ] },
];

function Sidebar({ menu, currentPage, setCurrentPage, collapsed, setCollapsed, counts }) {
  return (
    <aside className={'sb h-full bg-white border-r border-gray-200 flex flex-col ' + (collapsed ? 'collapsed' : '')}>
      {/* Logo: cao đúng 56px bằng thanh header (h-14) nên hai đường kẻ ngang thẳng hàng, thu gọn vẫn thấy logo */}
      <div className="flex items-center justify-center border-b border-gray-200 overflow-hidden" style={{ height: 56, flex: '0 0 56px' }}>
        <Logo collapsed={collapsed} />
      </div>

      <nav className="flex-1 overflow-y-auto py-2">
        {(menu || MENU).map(g => (
          <div key={g.group}>
            <div className="sb-group" title={g.group}>
              <i className={`fa-solid ${g.icon}`}></i>{!collapsed && <span>{g.group}</span>}
            </div>
            {g.items.map(item => (
              <div key={item.id} title={item.name} onClick={() => setCurrentPage(item.id)}
                   className={'sb-item ' + (currentPage === item.id ? 'on' : '')}>
                <i className={`fa-solid ${item.icon}`}></i>
                {!collapsed && <span>{item.name}</span>}
                {!collapsed && item.badge && counts[item.badge] != null && <span className="sb-badge">{Number(counts[item.badge]).toLocaleString('vi-VN')}</span>}
              </div>
            ))}
          </div>
        ))}
      </nav>

      {/* Nút thu / mở sidebar ở cuối */}
      <button className="sb-toggle" onClick={() => setCollapsed(!collapsed)} title={collapsed ? 'Mở rộng menu' : 'Thu gọn menu'}>
        <i className={`fa-solid ${collapsed ? 'fa-angles-right' : 'fa-angles-left'}`}></i>
        {!collapsed && <span>Thu gọn menu</span>}
      </button>
    </aside>
  );
}

function MainApp() {
  const { user, can, logout } = useAuth();
  const [currentPage, setCurrentPage] = useState('dashboard');
  const [collapsed, setCollapsed] = useState(() => { try { return localStorage.getItem('sb_collapsed') === '1'; } catch (e) { return false; } });
  const [counts, setCounts] = useState({});
  const [visited, setVisited] = useState({});          // tab nào đã mở thì giữ lại (ẩn đi chứ không huỷ) để không mất lệnh đang chọn
  const menu = useMemo(() => MENU.map(g => ({ ...g, items: g.items.filter(it => can('menu.' + it.id)) })).filter(g => g.items.length), [user]);
  const firstId = menu.length ? menu[0].items[0].id : '';
  const ok = (id) => can('menu.' + id);
  useEffect(() => { if (firstId && !can('menu.' + currentPage)) setCurrentPage(firstId); }, [user, currentPage]);
  useEffect(() => { setVisited(v => v[currentPage] ? v : { ...v, [currentPage]: true }); }, [currentPage]);

  useEffect(() => { try { localStorage.setItem('sb_collapsed', collapsed ? '1' : '0'); } catch (e) {} }, [collapsed]);

  useEffect(() => {
    let alive = true;
    const refresh = async () => {
      if (document.hidden) return;
      try {
        const a = await supabase.from(TB_BOM).select('*', { count: 'exact', head: true });
        const b = await supabase.from(TB_KANBAN).select('*', { count: 'exact', head: true });
        if (alive) setCounts({ tracuu: a.count, kanban: b.count });
      } catch (e) {}
    };
    refresh();
    const t = setInterval(refresh, 15000);
    window.addEventListener('bk-changed', refresh);
    document.addEventListener('visibilitychange', refresh);
    return () => { alive = false; clearInterval(t); window.removeEventListener('bk-changed', refresh); document.removeEventListener('visibilitychange', refresh); };
  }, []);

  return (
    <div className="app-shell flex h-screen overflow-hidden">
      <ToastHost />
      <div className="no-print h-screen"><Sidebar menu={menu} currentPage={currentPage} setCurrentPage={setCurrentPage} collapsed={collapsed} setCollapsed={setCollapsed} counts={counts} /></div>
      <div className="app-col flex-1 flex flex-col min-w-0 h-screen">
        <header className="no-print h-14 flex items-center justify-end gap-3 px-6 bg-white border-b border-gray-200">
          <span className="text-xs font-semibold text-slate-600"><i className="fa-solid fa-user mr-1.5 text-primary"></i>{user.full_name || user.username}{user.role === 'admin' ? ' · Admin' : ''}</span>
          <button className="btn" onClick={() => location.reload()}><i className="fa-solid fa-rotate"></i> Làm mới</button>
          <button className="btn" onClick={logout}><i className="fa-solid fa-right-from-bracket"></i> Đăng xuất</button>
        </header>
        <main className="app-main flex-1 overflow-y-auto p-5">
          {!firstId && <div className="card p-8 text-center text-gray-500">Tài khoản của bạn chưa được cấp quyền nào. Vui lòng liên hệ Admin.</div>}
          {currentPage === 'dashboard' && ok('dashboard') && <Dashboard />}
          {currentPage === 'tracuu' && ok('tracuu') && <TraCuu />}
          {currentPage === 'bom' && ok('bom') && <Bom />}
          {visited.indonhang && ok('indonhang') && <div style={{ display: currentPage === 'indonhang' ? 'block' : 'none' }}><InDonHang /></div>}
          {visited.kanban && ok('kanban') && <div style={{ display: currentPage === 'kanban' ? 'block' : 'none' }}><Kanban active={currentPage === 'kanban'} /></div>}
          {visited.bomkanban && ok('bomkanban') && <div style={{ display: currentPage === 'bomkanban' ? 'block' : 'none' }}><BomKanban active={currentPage === 'bomkanban'} /></div>}
          {visited.bomdonhang && ok('bomdonhang') && <div style={{ display: currentPage === 'bomdonhang' ? 'block' : 'none' }}><BomDonHang active={currentPage === 'bomdonhang'} /></div>}
          {currentPage === 'phanquyen' && ok('phanquyen') && <PhanQuyen />}
        </main>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<AppGate />);
</script>
</body>
</html>
