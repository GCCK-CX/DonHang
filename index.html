         border:1px solid var(--line); background:#fff; color:#1e3a5f; cursor:pointer; white-space:nowrap; transition:.15s; }

  .btn-green   { background:#16a34a; border-color:#16a34a; color:#fff; } .btn-green:hover { background:#15803d; }
  .btn-red     { background:#dc2626; border-color:#dc2626; color:#fff; } .btn-red:hover { background:#b91c1c; }
  .inp { border:1px solid #cbd5e1; border-radius:8px; padding:7px 11px; font-size:13px; background:#fff; outline:none; }
  .inp:focus { border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.12); }
  .pill { padding:5px 14px; border-radius:999px; border:1px solid #c7d7ea; background:#f4f8fd; font-size:12px; font-weight:600; color:#1d58a8; cursor:pointer; }
  .pill:hover { background:#e6f0fb; }
  .pill.on { background:#0f172a; border-color:#0f172a; color:#fff; }

  /* ---------- Bảng dữ liệu (kiểu hình 1: header xanh đậm, cột khoá nền vàng nhạt) ---------- */
  table.erp { border-collapse:separate; border-spacing:0; width:100%; }
  table.erp thead th { position:sticky; top:0; z-index:10; background:var(--blue); color:#fff; font-size:12px; font-weight:700;
                       text-align:center; padding:9px 10px; border-right:1px solid rgba(255,255,255,.22); white-space:nowrap; }
  table.erp thead tr.sub th { top:37px; background:#2a68ba; }
  table.erp td { padding:6px 10px; font-size:12.5px; border-bottom:1px solid #e6ecf4; border-right:1px solid #f0f3f8; white-space:nowrap; }
  table.erp tbody tr:hover td { background:#eef6fe; }
  table.erp td.key { background:#f7edcb; font-weight:600; }
  table.erp td.ctr { text-align:center; }

  /* ---------- Sidebar ---------- */
  .sb { width:256px; transition:width .2s ease; }
  .sb.collapsed { width:74px; }
  .sb-group { display:flex; align-items:center; gap:10px; padding:10px 18px; margin:10px 10px 2px; border-radius:8px;

  .sb.collapsed .sb-group { justify-content:center; padding:10px 0; }
  .sb-item { display:flex; align-items:center; gap:11px; padding:9px 14px 9px 24px; margin:2px 10px; border-radius:8px;

  .sb-item:hover { background:#eef5fc; color:#1d58a8; }
  .sb-item.on { background:#dbeafe; color:#1d4ed8; font-weight:700; }
  .sb-item i { width:18px; text-align:center; font-size:14px; }
  .sb.collapsed .sb-item { justify-content:center; padding:10px 0; }
  .sb-badge { margin-left:auto; background:#e0ecf9; color:#1d58a8; font-size:10.5px; font-weight:700; padding:1px 8px; border-radius:999px; }
  .sb-toggle { display:flex; align-items:center; gap:10px; width:100%; padding:14px 22px; border-top:1px solid #e5ebf3; color:#334155;
               font-size:13px; font-weight:600; cursor:pointer; background:#fff; }

  /* ---------- TEM KANBAN (bố cục hình 3) — kích thước CỐ ĐỊNH 600x400px, ô không co dãn theo dữ liệu ---------- */

         grid-template-columns:minmax(0,40fr) minmax(0,193fr) minmax(0,91fr) minmax(0,169fr) minmax(0,78fr) minmax(0,155fr) minmax(0,86fr) minmax(0,170fr);

  .tem .fit { display:block; width:100%; }

  .tem .lbl { font-size:1.08em; text-transform:uppercase; }
  .tem .big { font-size:1.55em; }
  .tem .nm  { justify-content:flex-start; text-align:left; }
  .tem .qrcell { padding:4px; }
  .qr-box svg { width:100%; height:100%; display:block; }

  /* ---------- KANBAN: khung cố định, chỉ vùng tem cuộn ---------- */
  .kb-root { height:calc(100vh - 96px); display:flex; flex-direction:column; }   /* 96 = header 56 + padding main 40 */
  .kb-top  { flex:0 0 auto; }

               border:1px solid var(--line); border-radius:14px; }
  /* Tem co theo số tem/hàng: --ss = hệ số thu nhỏ (JS tính), khoảng cách giữa tem = --gap */
  .tem-wrap { display:flex; flex-wrap:wrap; gap:var(--gap,10px); align-content:flex-start; }
  .tem-page { position:relative; flex:0 0 auto; background:#fff; box-shadow:0 1px 4px rgba(15,23,42,.28);
              width:calc(600px * var(--ss,1)); height:calc(400px * var(--ss,1)); }
  .tem-page .tem { transform:scale(var(--ss,1)); transform-origin:0 0; }
  /* Số tờ in: nhãn đỏ chữ trắng, nhỏ, nhô ở góc trên phải (giống số mũ) — không in ra giấy */
  .tem-no { position:absolute; top:-8px; right:-6px; z-index:20; min-width:20px; height:18px; padding:0 6px;
            border-radius:9px; background:#dc2626; color:#fff; font-size:11px; font-weight:800; line-height:18px;
            text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.4); pointer-events:none; }

  /* ---------- IN ĐƠN HÀNG: cỡ chữ bảng Định mức ---------- */
  table.erp.dm td { font-size:32px; line-height:1.2; padding:8px 10px; }
  table.erp.dm td.sl   { font-size:46px; font-weight:800; }
  table.erp.dm td.bold { font-weight:800; }
  table.erp.dm td.note { font-size:12.5px; font-weight:400; }   /* Ghi chú giữ cỡ cũ */

  @media print {
    @page { size: A4 landscape; margin: 8mm; }
    .no-print { display:none !important; }
    html, body, #root, .app-shell, .app-col, .app-main { height:auto !important; overflow:visible !important; display:block !important; padding:0 !important; }
    body { background:#fff; }
    .card { box-shadow:none !important; border:none !important; }

    .tem-page { width:var(--pw); height:calc(var(--ph) - 1px); overflow:hidden; position:relative; }
    .tem-page:not(:last-child) { break-after:page; page-break-after:always; }
    .tem-page .tem { transform:var(--tf); transform-origin:0 0; }
    table.erp thead th { position:static; }
    .print-sheet table { font-size:9px; }
    table.erp.dm td.note { font-size:9px; }
    .kb-root { height:auto !important; display:block !important; }
    .kb-top  { display:none !important; }
    .kb-scroll { overflow:visible !important; height:auto !important; padding:0 !important; background:none !important; border:none !important; border-radius:0 !important; }
    .tem-wrap { gap:0 !important; }
    .tem-page { box-shadow:none !important; }
    .tem-no { display:none !important; }
  }
</style>

  { key: "duc_nhom", label: "Đúc nhôm", w: 90 },
  { key: "cua_vong", label: "Cưa vòng", w: 90 },
  { key: "tien", label: "Tiện", w: 70 },
  { key: "phay", label: "Phay", w: 70 },
  { key: "nguoi", label: "Nguội", w: 70 },
  { key: "nhiet", label: "Nhiệt", w: 70 },

// =====================================================================

// =====================================================================

// Các cột công đoạn của sheet BOM TỔNG VÀO: cột AN -> EY (ô có số = thứ tự gia công 1,2,3...)
const PROC_COLS = [["AN", "C.Tấm"], ["AO", "Laser"], ["AP", "CN"], ["AQ", "PLM tay TP"], ["AR", "VM"], ["AS", "Mài"], ["AT", "Cắt NC ống, hộp"], ["AU", "LS ống/TH"], ["AV", "Cưa Vòng TP"], ["AW", "PLM tay TP"], ["AX", "Uốn/Lốc"], ["AY", "Đột/ dập"], ["AZ", "Chấn NC/ CNC"], ["BA", "Lắp ráp LKCK ô tô"], ["BB", "Cán kệ kho lạnh"], ["BC", "Đúc nhôm"], ["BD", "Cưa GCCG"], ["BE", "Tiện"], ["BF", "Phay"], ["BG", "Nguội"], ["BH", "Nhiệt luyện"], ["BI", "Cán Tole-Diềm"], ["BJ", "PLM tay HT"], ["BK", "Hàn Thùng tải"], ["BL", "Hàn Thùng Ben"], ["BM", "Lắp ráp Thùng"], ["BN", "XH LKR"], ["BO", "XH KX"], ["BP", "Lốc"], ["BQ", "Hàn LK NĐH ghế"], ["BR", "Hàn LK Tải/ Bus"], ["BS", "Hàn SP trong nước"], ["BT", "Hàn SP xuất khẩu"], ["BU", "Lắp ráp LKCK"], ["BV", "Plasma tay"], ["BW", "SX ĐĨA"], ["BX", "SX VÀNH"], ["BY", "Hàn Mâm xe"], ["BZ", "Phun bi"], ["CA", "Phốt phát"], ["CB", "ED"], ["CC", "Xi mạ"], ["CD", "Sơn bột"], ["CE", "Sơn màu"], ["CF", "Gác thùng"], ["CG", "Kho THCK"], ["CH", "Phay cơ NMK"], ["CI", "Tiện cơ NMK"], ["CJ", "Khoan lỗ sâu CNC NMK"], ["CK", "Phay CNC NMK"], ["CL", "Làm nguội NMK"], ["CM", "Nhiệt luyện SKD NMK"], ["CN", "Mài mặt phẳng NMK"], ["CO", "Cắt dây NMK"], ["CP", "Bắn điện NMK"], ["CQ", "Kiểm tra NMK"], ["CR", "Lắp ráp NMK"], ["CS", "Thử Khuôn NMK"], ["CT", "Kho NMK"], ["CU", "Đột KTV"], ["CV", "Dập KTV"], ["CW", "Laser 3D KTV"], ["CX", "Hàn đai ốc KTV"], ["CY", "Hàn Bấm KTV"], ["CZ", "Hàn CO2 KTV"], ["DA", "Chuyền tán chassis KTV"], ["DB", "Gấp mí KTV"], ["DC", "Kho KTV"], ["DD", "Kho nhập TBCD"], ["DE", "Laser thép tấm TBCD"], ["DF", "Laser thép hình TBCD"], ["DG", "Cắt oxy-gas TBCD"], ["DH", "Cưa vòng TBCD"], ["DI", "Plasma tay TBCD"], ["DJ", "Vát mép TBCD"], ["DK", "Khoan Taro TBCD"], ["DL", "Chấn TBCD"], ["DM", "Lốc/ Uốn/Ống gió TBCD"], ["DN", "Loe ống TBCD"], ["DO", "Hàn CNN TBCD"], ["DP", "Hàn CCCD TBCD"], ["DQ", "Hàn KLM TBCD"], ["DR", "Hàn KCT TBCD"], ["DS", "Hàn TBNC TBCD"], ["DT", "Sơn Phun bi TBCD"], ["DU", "Sơn Phun thuỷ tinh TBCD"], ["DV", "Sơn Sơn màu TBCD"], ["DW", "Kho xuất TBCD"], ["DX", "Lắp ráp Tóp ống TBCD"], ["DY", "Lắp ráp Nối băng tải TBCD"], ["DZ", "Lắp ráp TB CNN TBCD"], ["EA", "Lắp ráp CCCD TBCD"], ["EB", "Kho Đóng kiện TBCD"], ["EC", "Kho Giao hàng TBCD"], ["ED", "Lắp đặt TBCD"], ["EE", "Hàn KX Ghế DL TBDD"], ["EF", "Hàn Ống xả TBDD"], ["EG", "Hàn LK Tải/Bus, Lốc TBDD"], ["EH", "Hàn kết cấu kim loại & TBCN TBDD"], ["EI", "Hàn Kim loại màu TBDD"], ["EJ", "Hàn SP xuất khẩu TBDD"], ["EK", "Lắp ráp SP nước ngoài TBDD"], ["EL", "Sơn bột TBDD"], ["EM", "Sơn màu TBDD"], ["EN", "Kho TBDD"], ["EO", "XH LKR SMRM"], ["EP", "XH KX SMRM"], ["EQ", "X-Lắp ráp SMRM"], ["ER", "Kiểm định SMRM"], ["ES", "Đóng kiện SMRM"], ["ET", "Kho SMRM"], ["EU", "Part list"], ["EV", "NM Composite"], ["EW", "NM Cơ điện"], ["EX", "NM Nội thất"], ["EY", "Kho NM khác"]];

const colKey = (L) => 'col_' + L.toLowerCase();                       // 'AB' -> 'col_ab'
const cell = (r, L) => (r[colKey(L)] == null ? '' : String(r[colKey(L)]).trim());

// Danh sách công đoạn của 1 dòng BOM, sắp theo thứ tự gia công.
// Ô có thể chứa nhiều số: "3;10;14" hoặc "2,8,11" -> công đoạn đó xuất hiện ở bước 3, 10 và 14.
const getSteps = (r) => {
  const out = [];
  PROC_COLS.forEach(([L, label]) => {
    const v = cell(r, L);
    if (!v) return;
    v.split(/[;,]/).forEach(p => {
      const n = parseInt(p.trim(), 10);
      if (n > 0) out.push({ L, label, n });
    });
  });
  return out.sort((a, b) => a.n - b.n);
};

// Bản đồ { số_công_đoạn: tên } — số nào không có công đoạn thì để trống
const getStepMap = (r) => {
  const m = {};
  getSteps(r).forEach(s => { m[s.n] = m[s.n] ? m[s.n] + ' / ' + s.label : s.label; });
  return m;
};

// Chuẩn hoá mã LSX để đối chiếu
const normKey = (s) => String(s == null ? '' : s).trim().toUpperCase();

// Đọc hết bảng (Supabase chỉ trả tối đa 1000 dòng/lần nên phải lặp)
async function fetchAll(makeQuery) {
  let all = [], from = 0; const step = 1000;
  while (true) {
    const { data, error } = await makeQuery().range(from, from + step - 1);
    if (error) throw error;
    all = all.concat(data || []);
    if (!data || data.length < step) break;
    from += step;
  }
  return all;
}

function useLsxList(refreshKey) {
  const [list, setList] = useState([]);
  useEffect(() => {
    (async () => {
      try {
        const data = await fetchAll(() => supabase.from(TB_KANBAN).select('col_a').order('sheet_row'));
        setList(Array.from(new Set(data.map(d => d.col_a).filter(Boolean))));
      } catch (e) { console.error(e); }
    })();
  }, [refreshKey]);
  return list;
}

function Logo({ collapsed }) {
  if (LOGO_URL) return <img src={LOGO_URL} alt="THACO" style={{ height: collapsed ? 26 : 34 }} />;
  return (
    <svg viewBox="0 0 160 40" style={{ height: collapsed ? 22 : 32 }}>
      <text x="0" y="32" fontFamily="Arial Black, Arial, sans-serif" fontWeight="900" fontSize="38" letterSpacing="1" fill="#1b4f9c">
        {collapsed ? 'T' : 'THACO'}
      </text>
    </svg>
  );
}

function QR({ text, size = 130 }) {
  const html = useMemo(() => {
    try {
      qrcode.stringToBytes = (s) => Array.from(new TextEncoder().encode(s));   // hỗ trợ tiếng Việt (UTF-8)
      const q = qrcode(0, 'M'); q.addData(text, 'Byte'); q.make();             // tự chọn phiên bản theo độ dài
      return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    } catch (e) { return '<span style="font-size:11px">QR lỗi</span>'; }
  }, [text]);
  return <div className="qr-box" style={{ width: size, height: size }} dangerouslySetInnerHTML={{ __html: html }} />;
}

// =====================================================================
// 3. DASHBOARD
// =====================================================================
function Dashboard() {
  const [stats, setStats] = useState({ tongDH: 0, tongDong: 0, choNhanVT: 0, choGiao: 0 });
  const [recentLsx, setRecentLsx] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => { load(); }, []);

  const load = async () => {
    setLoading(true);
    const { data, count: tongDong } = await supabase.from(TB_BOM).select('lsx, nhan_vat_tu, giao_hang', { count: 'exact' });
    if (data) {
      const lsxSet = new Set(data.map(d => d.lsx));
      const choNhanVT = data.filter(d => !d.nhan_vat_tu).length;
      const choGiao = data.filter(d => !d.giao_hang).length;
      setStats({ tongDH: lsxSet.size, tongDong: tongDong ?? data.length, choNhanVT, choGiao });

      const order = [];
      for (const lsx of lsxSet) { if (!order.includes(lsx)) order.push(lsx); }
      setRecentLsx(order.slice(-8).reverse());
    }
    setLoading(false);
  };

  const cards = [
    { title: 'Tổng số LSX', value: stats.tongDH, color: 'text-blue-600', bg: 'bg-blue-50', icon: 'fa-clipboard-list' },
    { title: 'Tổng dòng BOM', value: stats.tongDong, color: 'text-slate-800', bg: 'bg-slate-100', icon: 'fa-layer-group' },
    { title: 'Chờ nhận vật tư', value: stats.choNhanVT, color: 'text-orange-500', bg: 'bg-orange-50', icon: 'fa-hourglass-half' },
    { title: 'Chờ giao hàng', value: stats.choGiao, color: 'text-red-500', bg: 'bg-red-50', icon: 'fa-truck-fast' },
  ];

  return (
    <div>
      <div className="grid grid-cols-1 md:grid-cols-4 gap-5 mb-5">
        {cards.map((c, i) => (
          <div key={i} className="card p-5 flex items-center gap-4">
            <div className={`w-12 h-12 rounded-xl flex items-center justify-center ${c.bg} ${c.color}`}>
              <i className={`fa-solid ${c.icon} text-lg`}></i>
            </div>
            <div>
              <p className="text-xs text-gray-500 font-semibold">{c.title}</p>
              <p className={`text-2xl font-extrabold mt-0.5 ${c.color}`}>{loading ? '…' : c.value}</p>
            </div>
          </div>
        ))}
      </div>
      <div className="card p-5">
        <h3 className="font-bold text-slate-700 mb-3 text-sm">Lệnh sản xuất gần đây</h3>
        <div className="flex flex-wrap gap-2">
          {recentLsx.length === 0 && !loading && <p className="text-gray-400 text-sm">Chưa có dữ liệu.</p>}
          {recentLsx.map(lsx => (
            <span key={lsx} className="px-3 py-1 bg-blue-50 text-primary rounded-full text-xs font-semibold">{lsx}</span>
          ))}
        </div>
      </div>
    </div>
  );
}

// =====================================================================
// 4. TRA CỨU — bảng kiểu hình 1, lọc LSX, pill công đoạn, toggle Nhận VT / Giao hàng
// =====================================================================
const QC_KEYS = ['dai', 'rong', 'day', 'hinh_hop', 'dn', 'dt'];
const KEY_COLS = ['lsx', 'sl_dh'];
const STAGES = [
  ['all', 'Tất cả'], ['duc_nhom', 'Đúc nhôm'], ['cua_vong', 'Cưa vòng'], ['tien', 'Tiện'],
  ['phay', 'Phay'], ['nguoi', 'Nguội'], ['nhiet', 'Nhiệt'],
];

function TraCuu() {
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);
  const [q, setQ] = useState('');
  const [lsxSel, setLsxSel] = useState('');
  const [stage, setStage] = useState('all');
  const pendingSaves = useRef(new Set());

  useEffect(() => { load(); }, []);

  const load = async () => {
    setLoading(true);
    try {
      const data = await fetchAll(() => supabase.from(TB_BOM).select('*').order('lsx', { ascending: false }).order('stt_ct'));
      setRows(data);
    } catch (e) { console.error(e); }
    setLoading(false);
  };

  const lsxOpts = useMemo(() => Array.from(new Set(rows.map(r => r.lsx).filter(Boolean))), [rows]);
  const has = (r, k) => r[k] != null && String(r[k]).trim() !== '';

  const base = useMemo(() => {
    const s = q.trim().toLowerCase();
    return rows.filter(r =>
      (!lsxSel || r.lsx === lsxSel) &&
      (!s || (r.lsx || '').toLowerCase().includes(s) || (r.msct || '').toLowerCase().includes(s) ||
        (r.ten_chi_tiet || '').toLowerCase().includes(s) || (r.san_pham || '').toLowerCase().includes(s))
    );
  }, [rows, q, lsxSel]);

  const filtered = useMemo(() => base.filter(r => stage === 'all' || has(r, stage)), [base, stage]);

  // Optimistic toggle cho Nhận VT / Giao hàng
  const toggleBool = async (row, field) => {
    const key = row.id + '-' + field;
    if (pendingSaves.current.has(key)) return;
    pendingSaves.current.add(key);
    const newVal = !row[field];
    setRows(prev => prev.map(r => r.id === row.id ? { ...r, [field]: newVal } : r));
    const { error } = await supabase.from(TB_BOM).update({ [field]: newVal }).eq('id', row.id);
    if (error) {
      setRows(prev => prev.map(r => r.id === row.id ? { ...r, [field]: !newVal } : r));
      alert('Lưu thất bại: ' + error.message);
    }
    pendingSaves.current.delete(key);
  };

  const qcIdx = BOM_COLUMNS.findIndex(c => c.key === QC_KEYS[0]);

  return (
    <div className="space-y-3">
      {/* Thanh công cụ */}
      <div className="card p-3 flex flex-wrap items-center gap-3">
        <span className="text-xs font-bold text-slate-500">Lệnh sản xuất</span>
        <select value={lsxSel} onChange={e => setLsxSel(e.target.value)} className="inp" style={{ minWidth: 180 }}>
          <option value="">Tất cả LSX</option>
          {lsxOpts.map(l => <option key={l} value={l}>{l}</option>)}
        </select>
        <input value={q} onChange={e => setQ(e.target.value)} placeholder="Tìm theo LSX / MSCT / Tên chi tiết / Sản phẩm…" className="inp" style={{ width: 340 }} />
        <button className="btn ml-auto" onClick={load}><i className="fa-solid fa-rotate"></i> Làm mới</button>
      </div>

      {/* Pill công đoạn */}
      <div className="card p-3 flex flex-wrap items-center gap-2">
        <span className="text-xs font-bold text-slate-500 mr-1">Công đoạn</span>
        {STAGES.map(([k, label]) => (
          <button key={k} className={'pill ' + (stage === k ? 'on' : '')} onClick={() => setStage(k)}>
            {label} ({k === 'all' ? base.length : base.filter(r => has(r, k)).length} dòng)
          </button>
        ))}
      </div>

      {/* Bảng */}
      <div className="card overflow-auto" style={{ maxHeight: '68vh' }}>
        <table className="erp">
          <thead>
            <tr>
              {BOM_COLUMNS.map((c, i) => {
                if (QC_KEYS.includes(c.key)) {
                  return i === qcIdx ? <th key="qc" colSpan={QC_KEYS.length}>QUY CÁCH (PHÔI)</th> : null;
                }
                return <th key={c.key} rowSpan={2} style={{ minWidth: c.w }}>{c.label}</th>;
              })}
            </tr>
            <tr className="sub">
              {BOM_COLUMNS.filter(c => QC_KEYS.includes(c.key)).map(c => <th key={c.key} style={{ minWidth: c.w }}>{c.label}</th>)}
            </tr>
          </thead>
          <tbody>
            {loading ? (
              <tr><td colSpan={BOM_COLUMNS.length} className="text-center py-8 text-gray-400">Đang tải…</td></tr>
            ) : filtered.length === 0 ? (
              <tr><td colSpan={BOM_COLUMNS.length} className="text-center py-8 text-gray-400">Không tìm thấy dữ liệu.</td></tr>
            ) : filtered.map(r => (
              <tr key={r.id}>
                {BOM_COLUMNS.map(c => (
                  <td key={c.key} className={(KEY_COLS.includes(c.key) ? 'key ' : '') + (c.w <= 90 ? 'ctr' : '')}>
                    {c.type === 'bool' ? (
                      <input type="checkbox" checked={!!r[c.key]} onChange={() => toggleBool(r, c.key)} className="w-4 h-4 accent-blue-600 cursor-pointer" />
                    ) : (r[c.key] ?? '')}
                  </td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <p className="text-xs text-gray-400">{filtered.length} / {rows.length} dòng</p>
    </div>
  );
}

// =====================================================================
// 5. BOM — danh sách LSX, xem chi tiết, nhập CSV
// =====================================================================
function Bom() {
  const [orders, setOrders] = useState([]);
  const [loading, setLoading] = useState(true);
  const [selectedLsx, setSelectedLsx] = useState(null);
  const [details, setDetails] = useState([]);
  const [isImportOpen, setIsImportOpen] = useState(false);
  const [importLsx, setImportLsx] = useState('');
  const [file, setFile] = useState(null);

  useEffect(() => { fetchOrders(); }, []);

  const fetchOrders = async () => {
    setLoading(true);
    const { data } = await supabase.from(TB_BOM).select('lsx, san_pham, khgh').order('created_at', { ascending: false });
    const map = new Map();
    (data || []).forEach(d => { if (!map.has(d.lsx)) map.set(d.lsx, d); });
    setOrders(Array.from(map.values()));
    setLoading(false);
  };

  const viewDetails = async (lsx) => {
    setSelectedLsx(lsx);
    const { data } = await supabase.from(TB_BOM).select('*').eq('lsx', lsx).order('stt_ct');
    setDetails(data || []);
  };

  // CSV cột theo đúng thứ tự BOM_COLUMNS (trừ id_key tự sinh, nhan_vat_tu/giao_hang mặc định false)
  const handleImportBOM = async () => {
    if (!file || !importLsx) return alert('Vui lòng nhập mã LSX và chọn file CSV!');
    const reader = new FileReader();
    reader.onload = async (e) => {
      const lines = e.target.result.split('\n').filter(l => l.trim() !== '');
      const rows = [];
      for (let i = 1; i < lines.length; i++) {
        const c = lines[i].split(',');
        if (c.length < 16) continue;
        rows.push({
          stt: c[0], khgh: c[1], lsx: importLsx, san_pham: c[2], stt_ct: c[3], msct: c[4],
          ten_chi_tiet: c[5], vat_lieu: c[6], dai: c[7] || null, rong: c[8] || null, day: c[9] || null,
          hinh_hop: c[10] || null, dn: c[11] || null, dt: c[12] || null, sl_bo: c[13] || null, sl_dh: c[14] || null,
          khoi_luong: c[15] || null, cong_doan_truoc: c[16] || '', duc_nhom: c[17] || '', cua_vong: c[18] || '',
          tien: c[19] || '', phay: c[20] || '', nguoi: c[21] || '', nhiet: c[22] || '',
          cong_doan_sau: c[23] || '', ghi_chu_dmvt: c[24] || '', ghi_chu: c[25] || ''
        });
      }
      const { data, error } = await supabase.rpc('import_bom_rows', { p_rows: rows });
      if (error) alert('Lỗi khi Import: ' + error.message);
      else { alert(`Import thành công ${data.inserted} dòng. Thất bại: ${data.failed}`); setIsImportOpen(false); fetchOrders(); }
    };
    reader.readAsText(file);
  };

  if (selectedLsx) {
    return (
      <div className="space-y-3">
        <div className="card p-3 flex items-center gap-3">
          <button onClick={() => setSelectedLsx(null)} className="btn"><i className="fa-solid fa-arrow-left"></i> Quay lại</button>
          <span className="font-bold text-slate-700 text-sm">Chi tiết LSX: <span className="text-primary">{selectedLsx}</span></span>
        </div>
        <div className="card overflow-auto" style={{ maxHeight: '72vh' }}>
          <table className="erp">
            <thead>
              <tr><th>STT CT</th><th>MSCT</th><th>Tên chi tiết</th><th>SL/ĐH</th><th>Nhận VT</th><th>Giao hàng</th></tr>
            </thead>
            <tbody>
              {details.map(d => (
                <tr key={d.id}>
                  <td className="ctr">{d.stt_ct}</td>
                  <td className="font-semibold">{d.msct}</td>
                  <td>{d.ten_chi_tiet}</td>
                  <td className="key ctr">{d.sl_dh}</td>
                  <td className="ctr">{d.nhan_vat_tu ? '✔' : ''}</td>
                  <td className="ctr">{d.giao_hang ? '✔' : ''}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    );
  }

  return (
    <div className="space-y-3">
      <div className="card p-3 flex items-center gap-3">
        <span className="text-xs font-bold text-slate-500">{orders.length} lệnh sản xuất</span>
        <button onClick={fetchOrders} className="btn ml-auto"><i className="fa-solid fa-rotate"></i> Làm mới</button>
        <button onClick={() => setIsImportOpen(true)} className="btn btn-green"><i className="fa-solid fa-file-csv"></i> Nhập BOM (CSV)</button>
      </div>
      <div className="card overflow-auto" style={{ maxHeight: '72vh' }}>
        <table className="erp">
          <thead><tr><th>LSX</th><th>Sản phẩm</th><th>KHGH</th><th>Hành động</th></tr></thead>
          <tbody>
            {loading ? <tr><td colSpan="4" className="text-center py-6 text-gray-400">Đang tải…</td></tr> :
              orders.map(o => (
                <tr key={o.lsx}>
                  <td className="key cursor-pointer text-primary" onClick={() => viewDetails(o.lsx)}>{o.lsx}</td>
                  <td>{o.san_pham}</td>
                  <td>{o.khgh}</td>
                  <td><button onClick={() => viewDetails(o.lsx)} className="text-primary hover:text-blue-800 font-semibold text-xs">Xem BOM</button></td>
                </tr>
              ))}
          </tbody>
        </table>
      </div>

      {isImportOpen && (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
          <div className="bg-white p-6 rounded-2xl w-full max-w-md shadow-2xl">
            <h2 className="text-lg font-bold mb-4">Nhập BOM từ CSV</h2>
            <div className="space-y-4">
              <input type="text" placeholder="Mã LSX" value={importLsx} onChange={e => setImportLsx(e.target.value)} className="inp w-full" />
              <input type="file" accept=".csv" onChange={e => setFile(e.target.files[0])} className="inp w-full" />
              <div className="flex justify-end gap-3 mt-6">
                <button onClick={() => setIsImportOpen(false)} className="btn">Hủy</button>
                <button onClick={handleImportBOM} className="btn btn-green">Import</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// =====================================================================
// 6. IN ĐƠN HÀNG — bảng Định mức vật tư (hình 6), nhập LSX để tìm, nút in
//    Dữ liệu lấy từ bảng Bomkanban (sheet BOM TỔNG VÀO). NC1..NC10 = 10 công đoạn đầu theo thứ tự gia công.
// =====================================================================
function InDonHang() {
  const lsxList = useLsxList();
  const [input, setInput] = useState('');
  const [khgh, setKhgh] = useState('');
  const [rows, setRows] = useState([]);
  const [lsxShown, setLsxShown] = useState('');
  const [loading, setLoading] = useState(false);
  const [searched, setSearched] = useState(false);

  const search = async (value) => {
    const v = (value ?? input).trim();
    if (!v) return;
    setLoading(true); setSearched(true);
    try {
      const data = await fetchAll(() => supabase.from(TB_KANBAN).select('*').ilike('col_a', `%${v}%`).order('sheet_row'));
      setRows(data);
      setLsxShown(data.length ? data[0].col_a : v);
    } catch (e) { alert('Lỗi tìm kiếm: ' + e.message); }
    setLoading(false);
  };

  const NC = 10;
  const TOTAL_COLS = 12 + NC + 3;
  let colNo = 0; const no = () => ++colNo;

  return (
    <div className="space-y-3">
      {/* Thanh công cụ (không in) */}
      <div className="no-print card p-3 flex flex-wrap items-center gap-3">
        <span className="text-xs font-bold text-slate-500">Lệnh sản xuất</span>
        <input list="lsx-datalist" value={input} onChange={e => setInput(e.target.value)}
          onKeyDown={e => e.key === 'Enter' && search()} placeholder="Nhập mã lệnh sản xuất…" className="inp" style={{ width: 240 }} />
        <datalist id="lsx-datalist">{lsxList.map(l => <option key={l} value={l} />)}</datalist>
        <button onClick={() => search()} className="btn btn-primary"><i className="fa-solid fa-magnifying-glass"></i> Tìm kiếm</button>
        <span className="text-xs font-bold text-slate-500 ml-3">KH GH</span>
        <input value={khgh} onChange={e => setKhgh(e.target.value)} placeholder="Ngày/kế hoạch giao hàng" className="inp" style={{ width: 200 }} />
        <button onClick={() => window.print()} disabled={!rows.length} className="btn btn-green ml-auto" style={{ opacity: rows.length ? 1 : .5 }}>
          <i className="fa-solid fa-print"></i> In đơn hàng
        </button>
      </div>

      {loading && <div className="no-print card p-6 text-center text-gray-400">Đang tải…</div>}
      {!loading && searched && rows.length === 0 && <div className="no-print card p-6 text-center text-gray-400">Không tìm thấy lệnh sản xuất “{input}”.</div>}
      {!loading && !searched && <div className="no-print card p-6 text-center text-gray-400">Nhập mã lệnh sản xuất rồi bấm Tìm kiếm (hoặc nhấn Enter).</div>}

      {rows.length > 0 && !loading && (
        <div className="print-sheet card overflow-auto p-2">
          <table className="erp dm" style={{ minWidth: 1500 }}>
            <thead>
              <tr>
                <th colSpan={TOTAL_COLS} style={{ background: '#fff', color: '#000', fontSize: 46, lineHeight: 1.25, borderBottom: '1px solid #000' }}>
                  ĐỊNH MỨC VẬT TƯ<br /><span>XƯỞNG: Gia Công Cơ Khí Chính xác</span>
                </th>
              </tr>
              <tr>
                {['TT', 'MSCT', 'Tên chi tiết', 'Vật liệu', 'Dài', 'Rộng', 'Dày', 'Hình/ hộp', 'Dn', 'Dt', 'SL/SP', 'SL/ĐH'].map((h, i) => (
                  <th key={h} rowSpan={3} style={{ background: '#fff', color: '#000', border: '1px solid #000', minWidth: i === 2 ? 220 : i === 1 ? 110 : 52 }}>
                    {h}
                  </th>
                ))}
                <th colSpan={NC} style={{ background: '#ffff00', color: '#000', border: '1px solid #000' }}>KH GH {khgh && `: ${khgh}`}</th>
                <th colSpan={3} rowSpan={2} style={{ background: '#fff', color: '#000', border: '1px solid #000', fontSize: 20 }}>{lsxShown}</th>
              </tr>
              <tr>
                <th colSpan={NC} style={{ background: '#fbe5a2', color: '#000', border: '1px solid #000' }}>Công đoạn gia công</th>
              </tr>
              <tr>
                {Array.from({ length: NC }, (_, i) => (
                  <th key={i} style={{ background: '#fbe5a2', color: '#000', border: '1px solid #000', minWidth: 150 }}>NC{i + 1}</th>
                ))}
                <th style={{ background: '#fbe5a2', color: '#000', border: '1px solid #000', minWidth: 80 }}>Bên giao<br /><span style={{ fontSize: 9 }}>(Ký và ghi rõ họ tên)</span></th>
                <th style={{ background: '#fbe5a2', color: '#000', border: '1px solid #000', minWidth: 80 }}>Bên nhận<br /><span style={{ fontSize: 9 }}>(Ký và ghi rõ họ tên)</span></th>
                <th style={{ background: '#fbe5a2', color: '#000', border: '1px solid #000', minWidth: 120 }}>Ghi chú</th>
              </tr>
              <tr>
                {Array.from({ length: TOTAL_COLS }, (_, i) => (
                  <th key={i} style={{ background: '#cdf5fb', color: '#000', border: '1px solid #000', padding: '3px 4px' }}>{no()}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {rows.map((r, idx) => {
                const stepMap = getStepMap(r);
                const bd = { border: '1px solid #000' };
                return (
                  <tr key={r.id}>
                    <td className="ctr bold" style={bd}>{cell(r, 'B') || idx + 1}</td>
                    <td style={bd}>{cell(r, 'Q')}</td>
                    <td className="bold" style={{ ...bd, whiteSpace: 'normal' }}>{cell(r, 'R')}</td>
                    <td className="ctr" style={bd}>{cell(r, 'U')}</td>
                    <td className="ctr" style={bd}>{cell(r, 'AB')}</td>
                    <td className="ctr" style={bd}>{cell(r, 'AC')}</td>
                    <td className="ctr" style={bd}>{cell(r, 'AD')}</td>
                    <td className="ctr" style={bd}>{cell(r, 'AE')}</td>
                    <td className="ctr" style={bd}>{cell(r, 'AF')}</td>
                    <td className="ctr" style={bd}>{cell(r, 'AG')}</td>
                    <td className="ctr" style={bd}>{cell(r, 'AI')}</td>
                    <td className="ctr sl" style={bd}>{cell(r, 'AJ')}</td>
                    {Array.from({ length: NC }, (_, i) => (
                      <td key={i} className="ctr bold" style={{ ...bd, whiteSpace: 'normal' }}>{stepMap[i + 1] || ''}</td>
                    ))}
                    <td style={bd}></td>
                    <td style={bd}></td>
                    <td className="note" style={{ ...bd, whiteSpace: 'normal' }}>{cell(r, 'EZ')}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// =====================================================================
// 7. KANBAN — tem Kanban (bố cục hình 3), mỗi dòng Bomkanban = 1 tem
// =====================================================================

// >>> Chỗ này để NỐI DỮ LIỆU vào từng ô của tem. Đổi cột chỉ cần sửa chữ cái cột Excel (ví dụ 'AB').
//     Ô nào để '' là chờ bạn cung cấp thông tin.
const TEM_MAP = {
  lsx:        r => cell(r, 'A'),     // Lệnh sản xuất
  don_hang:   r => '',               // (ô dài bên phải LSX) tên/mã đơn hàng — CHỜ THÔNG TIN
  ma_ct:      r => cell(r, 'Q'),     // Mã chi tiết
  khach_hang: r => '',               // Khách hàng — CHỜ THÔNG TIN
  ten_ct:     r => cell(r, 'R'),     // Tên chi tiết
  ngay_ht:    r => '',               // Ngày HT — CHỜ THÔNG TIN
  vat_lieu:   r => cell(r, 'U'),     // Vật liệu
  heat_lot:   r => '',               // Số Heat/Lot — CHỜ THÔNG TIN
  stt_ct:     r => cell(r, 'B'),     // STT chi tiết
  hinh_hop:   r => cell(r, 'AE'),    // Hình/hộp
  dai:        r => cell(r, 'AB'),    // Dài
  day:        r => cell(r, 'AD'),    // Dày
  so_luong:   r => cell(r, 'AJ'),    // Số lượng (SL/ĐH)
  rong:       r => cell(r, 'AC'),    // Rộng
  dn_dt:      r => { let a = cell(r, 'AF'); const b = cell(r, 'AG'); if (a && !/^Ø/.test(a)) a = 'Ø' + a; return (a || b) ? a + '/' + b : ''; },
  ghi_chu:    r => cell(r, 'EZ'),    // Ghi chú
  may_gc:     r => '',               // Máy GC — CHỜ THÔNG TIN
};

// Chữ tự thu nhỏ để vừa ô (ô tem luôn cố định kích thước, không giãn theo dữ liệu)
function Fit({ children, nowrap, min = 0.4 }) {
  const ref = useRef(null);
  const fit = () => {
    const el = ref.current; if (!el) return;
    const p = el.parentElement;
    el.style.fontSize = '1em';
    let f = 1;
    const over = () => el.scrollWidth > el.clientWidth + 0.5 || el.offsetHeight > p.clientHeight - 2;
    while (over() && f > min) { f -= 0.04; el.style.fontSize = f + 'em'; }
  };
  useLayoutEffect(fit, [children]);
  useEffect(() => { if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit); }, [children]);
  return <span ref={ref} className={'fit' + (nowrap ? ' nw' : '')}>{children}</span>;
}
const TLb = ({ c, children }) => <div className="tc lbl" style={{ gridColumn: c }}><Fit nowrap>{children}</Fit></div>;
const TVl = ({ c, big, nowrap, children }) => <div className={'tc ' + (big ? 'big' : '')} style={{ gridColumn: c }}><Fit nowrap={nowrap || big}>{children}</Fit></div>;

  const qrText = [d.lsx, d.stt_ct, d.ma_ct, d.ten_ct, d.so_luong].join(' | ');

      <TLb c="5 / 6">Dài</TLb><TVl c="6 / 7" nowrap>{d.dai}</TVl><TLb c="7 / 8">Dày</TLb><TVl c="8 / 9" nowrap>{d.day}</TVl>

      <TLb c="1 / 3">Số lượng</TLb><TVl c="3 / 4" big>{d.so_luong}</TVl><TVl c="4 / 5">{d.hinh_hop}</TVl>
      <TLb c="5 / 6">Rộng</TLb><TVl c="6 / 7" nowrap>{d.rong}</TVl><TLb c="7 / 8">Dn/Dt</TLb><TVl c="8 / 9" big>{d.dn_dt}</TVl>

      {[0, 1, 2, 3, 4].map(i => (
        <React.Fragment key={i}>
          <div className="tc" style={{ gridColumn: '1 / 2' }}>{i + 1}</div>
          <div className="tc nm" style={{ gridColumn: '2 / 3' }}><Fit>{stepMap[i + 1] || ''}</Fit></div>
          <div className="tc" style={{ gridColumn: '3 / 4' }}>{i + 6}</div>
          <div className="tc nm" style={{ gridColumn: '4 / 5' }}><Fit>{stepMap[i + 6] || ''}</Fit></div>
          <div className="tc" style={{ gridColumn: '5 / 6' }}>{i + 11}</div>
          <div className="tc nm" style={{ gridColumn: '6 / 7' }}><Fit>{stepMap[i + 11] || ''}</Fit></div>
          {i === 0 && <div className="tc qrcell" style={{ gridColumn: '7 / 9', gridRow: 'span 5' }}><QR text={qrText} size="100%" /></div>}
        </React.Fragment>
      ))}

      <TLb c="1 / 3">Ghi chú</TLb><TVl c="3 / 7">{d.ghi_chu}</TVl><TLb c="7 / 8">Máy GC</TLb><TVl c="8 / 9">{d.may_gc}</TVl>
    </div>
  );
}

// ---- Nhập file Excel/CSV (sheet "BOM TỔNG VÀO") -> Supabase bảng Bomkanban, ghi từng lô 500 dòng ----
function ImportKanbanModal({ onClose, onDone }) {
  const [file, setFile] = useState(null);
  const [firstRow, setFirstRow] = useState(7);
  const [busy, setBusy] = useState(false);
  const [pct, setPct] = useState(0);
  const [msg, setMsg] = useState('');
  const [err, setErr] = useState('');
  const NCOL = 157, CHUNK = 500;           // 157 = cột FA
  const tick = () => new Promise(r => setTimeout(r, 30));
  const norm = (r) => { const o = new Array(NCOL); for (let i = 0; i < NCOL; i++) o[i] = r[i] == null ? '' : String(r[i]); return o; };

  const run = async () => {
    if (!file) return alert('Hãy chọn file Excel (.xlsx) hoặc CSV trước.');
    if (!confirm('Thao tác này sẽ XOÁ toàn bộ dữ liệu Bomkanban hiện có và thay bằng dữ liệu trong file. Tiếp tục?')) return;
    setBusy(true); setErr(''); setPct(0);
    try {
      setMsg('Đang đọc file…'); await tick();
      const buf = await file.arrayBuffer();
      let wb, name;
      if (/\.csv$/i.test(file.name)) {
        wb = XLSX.read(new TextDecoder('utf-8').decode(buf), { type: 'string', raw: true, dense: true });
        name = wb.SheetNames[0];
      } else {
        const names = XLSX.read(buf, { type: 'array', bookSheets: true }).SheetNames;
        name = names.includes('BOM TỔNG VÀO') ? 'BOM TỔNG VÀO' : names[0];
        setMsg(`Đang phân tích sheet "${name}" (file lớn có thể mất 1–2 phút, đừng đóng trang)…`); await tick();
        wb = XLSX.read(buf, { type: 'array', dense: true, sheets: name, cellFormula: false, cellHTML: false, cellStyles: false });
      }
      const ws = wb.Sheets[name];
      if (!ws) throw new Error('Không đọc được sheet ' + name);
      const all = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '', blankrows: true, range: Number(firstRow) - 1 });

      // bỏ các dòng trống ở cuối (cột A hoặc Q phải có dữ liệu)
      let last = all.length;
      while (last > 0 && !(String(all[last - 1][0] || '').trim() || String(all[last - 1][16] || '').trim())) last--;
      if (!last) throw new Error('Không thấy dữ liệu từ hàng ' + firstRow + ' trở đi.');

      setMsg('Đang xoá dữ liệu cũ…'); await tick();
      const c = await supabase.rpc('clear_bomkanban');
      if (c.error) throw new Error('Không xoá được dữ liệu cũ: ' + c.error.message);

      for (let s = 0; s < last; s += CHUNK) {
        const end = Math.min(s + CHUNK, last);
        const part = all.slice(s, end).map(norm);
        let ok = false, lastErr = '';
        for (let k = 0; k < 3 && !ok; k++) {           // thử lại tối đa 3 lần nếu rớt mạng
          const { error } = await supabase.rpc('import_bomkanban_chunk', { p_start: Number(firstRow) + s, p_rows: part });
          if (error) { lastErr = error.message; await new Promise(r => setTimeout(r, 800)); } else ok = true;
        }
        if (!ok) throw new Error(`Lỗi khi ghi dòng ${Number(firstRow) + s}: ${lastErr}`);
        setPct(Math.round(end / last * 100));
        setMsg(`Đã ghi ${end.toLocaleString('vi-VN')} / ${last.toLocaleString('vi-VN')} dòng`);
        await tick();
      }
      setMsg(`✔ Hoàn tất: đã nhập ${last.toLocaleString('vi-VN')} dòng.`);
      onDone();
    } catch (e) { setErr(e.message || String(e)); }
    setBusy(false);
  };

  return (
    <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 no-print">
      <div className="bg-white p-6 rounded-2xl w-full max-w-lg shadow-2xl">
        <h2 className="text-lg font-bold mb-1">Nhập dữ liệu BOM TỔNG VÀO</h2>
        <p className="text-xs text-gray-500 mb-4">Chọn file .xlsx tải từ Google Sheet (hoặc CSV của sheet BOM TỔNG VÀO). Cột A→FA, dữ liệu từ hàng bắt đầu bên dưới.</p>
        <div className="space-y-3">
          <input type="file" accept=".xlsx,.xls,.csv" disabled={busy} onChange={e => setFile(e.target.files[0])} className="inp w-full" />
          <div className="flex items-center gap-2 text-sm">
            <span className="text-slate-600">Dữ liệu bắt đầu từ hàng</span>
            <input type="number" min="1" value={firstRow} disabled={busy} onChange={e => setFirstRow(e.target.value)} className="inp" style={{ width: 80 }} />
          </div>
          {(busy || msg) && (
            <div>
              <div className="h-2 bg-gray-200 rounded-full overflow-hidden"><div className="h-2 bg-primary transition-all" style={{ width: pct + '%' }}></div></div>
              <p className="text-xs text-slate-600 mt-1">{msg}</p>
            </div>
          )}
          {err && <p className="text-xs text-red-600 bg-red-50 p-2 rounded">{err}</p>}
        </div>
        <div className="flex justify-end gap-3 mt-5">
          <button onClick={onClose} disabled={busy} className="btn">{busy ? 'Đang chạy…' : 'Đóng'}</button>
          <button onClick={run} disabled={busy || !file} className="btn btn-green" style={{ opacity: busy || !file ? .5 : 1 }}><i className="fa-solid fa-cloud-arrow-up"></i> Bắt đầu nhập</button>
        </div>
      </div>
    </div>
  );
}

function Kanban({ active }) {
  const [ver, setVer] = useState(0);
  const [importOpen, setImportOpen] = useState(false);
  const lsxList = useLsxList(ver);
  const [input, setInput] = useState('');
  const [lsx, setLsx] = useState('');
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(false);
  const [stage, setStage] = useState('');          // '' = tất cả; còn lại = mã cột công đoạn (vd 'AO')
  const [page, setPage] = useState(1);
  const [showAll, setShowAll] = useState(false);
  const [printing, setPrinting] = useState(false);
  const [cfgOpen, setCfgOpen] = useState(false);   // hộp thoại Cấu hình
  const [sttInput, setSttInput] = useState('');    // lọc theo STT chi tiết: "5,14,23"
  const [pkh, setPkh] = useState({});              // dữ liệu LSX_PKH: { 'TBCN.564/11': {...} }
  const PAGE = 12;
  const GAP = 10;                                   // khoảng cách giữa các tem (px) — muốn sát hơn thì giảm số này

  // ---- Khổ giấy tem (mm) + số tem trên 1 hàng (lưu lại trong trình duyệt) ----
  const lsGet = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } };
  const [pw, setPw] = useState(() => Number(lsGet('tem_w', 150)) || 150);
  const [ph, setPh] = useState(() => Number(lsGet('tem_h', 100)) || 100);
  const [rot, setRot] = useState(() => lsGet('tem_rot', '0') === '1');
  const [perRow, setPerRow] = useState(() => { const n = Number(lsGet('tem_perrow_v2', 4)); return [2, 3, 4].includes(n) ? n : 4; });
  useEffect(() => {
    try {
      localStorage.setItem('tem_w', pw); localStorage.setItem('tem_h', ph);
      localStorage.setItem('tem_rot', rot ? '1' : '0'); localStorage.setItem('tem_perrow_v2', perRow);
    } catch (e) {}
  }, [pw, ph, rot, perRow]);

  // Khổ giấy khi in — chỉ áp dụng lúc đang đứng ở tab Kanban (tránh ảnh hưởng tab In đơn hàng)
  useEffect(() => {
    if (!active) return;
    let el = document.getElementById('tem-page-style');
    if (!el) { el = document.createElement('style'); el.id = 'tem-page-style'; document.head.appendChild(el); }
    el.textContent = `@page { size: ${pw}mm ${ph}mm; margin: 0; }`;
    return () => { el.textContent = ''; };
  }, [pw, ph, active]);

  const printVars = useMemo(() => {                  // co tem 600x400px vừa khổ giấy, canh giữa
    const PX = 96 / 25.4, DW = 600, DH = 400, W = pw * PX, H = ph * PX;
    let tf;
    if (!rot) {
      const s = Math.min(W / DW, H / DH);
      tf = `translate(${(W - DW * s) / 2}px, ${(H - DH * s) / 2}px) scale(${s})`;
    } else {
      const s = Math.min(W / DH, H / DW);
      tf = `translate(${(W - DH * s) / 2 + DH * s}px, ${(H - DW * s) / 2}px) rotate(90deg) scale(${s})`;
    }
    return { '--tf': tf, '--pw': pw + 'mm', '--ph': ph + 'mm' };
  }, [pw, ph, rot]);

  // ---- Đo bề rộng khung để tính tỉ lệ thu nhỏ tem theo số tem/hàng ----
  const scrollRef = useRef(null);
  const [boxW, setBoxW] = useState(0);
  useEffect(() => {
    const el = scrollRef.current; if (!el) return;
    const measure = () => { const w = el.clientWidth; if (w > 0) setBoxW(w); };   // tab đang ẩn (w=0) thì bỏ qua
    measure();
    const ro = new ResizeObserver(measure); ro.observe(el);
    return () => ro.disconnect();
  }, []);
  const scale = useMemo(() => {
    if (!boxW) return 1;
    const inner = boxW - 24 - 12;                    // trừ padding hai bên + chừa chỗ cho nhãn số tờ
    const s = (inner - GAP * (perRow - 1)) / perRow / 600;
    return Math.floor(Math.min(1, Math.max(0.2, s)) * 1000) / 1000;
  }, [boxW, perRow]);

  const load = async (value) => {
    const v = (value || '').trim();
    if (!v) { setRows([]); return; }
    setLoading(true); setPage(1); setStage('');
    try {
      let data = await fetchAll(() => supabase.from(TB_KANBAN).select('*').eq('col_a', v).order('sheet_row'));
      if (!data.length) data = await fetchAll(() => supabase.from(TB_KANBAN).select('*').ilike('col_a', `%${v}%`).order('sheet_row'));
      setRows(data);
      // Lấy Số đơn hàng / Khách hàng / Ngày HT cho các LSX đang hiển thị
      try {
        const keys = Array.from(new Set(data.map(d => String(d.col_a || '').trim()).filter(Boolean)));
        const m = {};
        if (keys.length) {
          const { data: p, error } = await supabase.from(TB_PKH).select('lsx, so_don_hang, khach_hang, ngay_hoan_thanh').in('lsx', keys);
          if (error) throw error;
          (p || []).forEach(x => { const k = normKey(x.lsx); if (!m[k]) m[k] = x; });
        }
        setPkh(m);
      } catch (e2) { console.error('LSX_PKH:', e2); setPkh({}); }
    } catch (e) { alert('Lỗi tải dữ liệu: ' + e.message); }
    setLoading(false);
  };
  useEffect(() => { load(lsx); }, [lsx]);

  const search = () => { const v = input.trim(); if (v === lsx) load(v); else setLsx(v); };   // Enter hoặc bấm Tìm

  // Công đoạn 1 của mỗi chi tiết = công đoạn có số thứ tự nhỏ nhất (thường là số 1)
  const firstOf = (r) => { const st = getSteps(r); return st.length ? st.filter(s => s.n === st[0].n) : []; };
  const stageList = useMemo(() => {
    const m = new Map();
    rows.forEach(r => firstOf(r).forEach(s => {
      const o = m.get(s.L) || { L: s.L, label: s.label, count: 0 }; o.count++; m.set(s.L, o);
    }));
    return Array.from(m.values()).sort((a, b) => b.count - a.count);
  }, [rows]);
  // Danh sách STT người dùng nhập: "5,14,23,26" -> ['5','14','23','26']
  const sttList = useMemo(() => sttInput.split(/[,;\s]+/).map(s => s.trim()).filter(Boolean), [sttInput]);
  const filtered = useMemo(() => {
    // Có nhập STT -> chỉ hiện đúng các STT đó, theo thứ tự đã nhập (bỏ qua lọc công đoạn)
    if (sttList.length) {
      const order = new Map(); sttList.forEach((s, i) => { if (!order.has(s)) order.set(s, i); });
      return rows
        .filter(r => order.has(cell(r, 'B')))
        .sort((a, b) => order.get(cell(a, 'B')) - order.get(cell(b, 'B')));
    }
    return stage ? rows.filter(r => firstOf(r).some(s => s.L === stage)) : rows;
  }, [rows, stage, sttList]);

  const shown = showAll ? filtered : filtered.slice(0, page * PAGE);

  // Cuộn gần cuối khung thì tự tải thêm tem
  const onScroll = (e) => {
    const t = e.currentTarget;
    if (!showAll && shown.length < filtered.length && t.scrollTop + t.clientHeight >= t.scrollHeight - 300) setPage(p => p + 1);
  };

  const doPrint = () => { setShowAll(true); setPrinting(true); };
  useEffect(() => {
    if (!(printing && showAll)) return;
    const t = setTimeout(() => { window.print(); setPrinting(false); }, 800);
    return () => clearTimeout(t);
  }, [printing, showAll]);
  useEffect(() => {
    const h = () => setShowAll(false);
    window.addEventListener('afterprint', h);
    return () => window.removeEventListener('afterprint', h);
  }, []);

  return (
    <div className="kb-root">
      {/* ===== PHẦN CỐ ĐỊNH (không cuộn): thanh lệnh, khổ giấy, chọn công đoạn ===== */}
      <div className="kb-top no-print space-y-3 pb-3">

              <div className="card p-3 flex flex-wrap items-center gap-3">
          <span className="text-xs font-bold text-slate-500">Lệnh sản xuất</span>
          <input list="lsx-kanban-list" value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && search()}
            placeholder="Nhập lệnh sản xuất rồi nhấn Enter…" className="inp" style={{ width: 260 }} />
          <datalist id="lsx-kanban-list">{lsxList.map(l => <option key={l} value={l} />)}</datalist>
          <button className="btn btn-primary" onClick={search}><i className="fa-solid fa-magnifying-glass"></i> Tìm</button>
          <button className="btn" onClick={() => load(lsx)}><i className="fa-solid fa-rotate"></i> Làm mới</button>

          <span className="text-xs font-bold text-slate-500 ml-2">STT chi tiết</span>
          <div className="relative">
            <input value={sttInput} onChange={e => setSttInput(e.target.value)} placeholder="VD: 5,14,23,26" className="inp" style={{ width: 190, paddingRight: 28 }} />
            {sttInput && (
              <button onClick={() => setSttInput('')} title="Xoá lọc"
                className="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-red-500"><i className="fa-solid fa-xmark"></i></button>
            )}
          </div>
          {sttList.length > 0 && <span className="text-xs text-slate-500">{filtered.length} / {sttList.length} STT tìm thấy</span>}

          <button className="btn ml-auto" onClick={() => setCfgOpen(true)}><i className="fa-solid fa-sliders"></i> Cấu hình</button>
          <button className="btn" onClick={() => setImportOpen(true)}><i className="fa-solid fa-file-excel"></i> Nhập Excel</button>
          <button className="btn btn-green" onClick={doPrint} disabled={!filtered.length} style={{ opacity: filtered.length ? 1 : .5 }}>
            <i className="fa-solid fa-print"></i> In tem ({filtered.length})
          </button>
        </div>

        {rows.length > 0 && (
          <div className="card p-3 flex flex-wrap items-center gap-2" style={{ maxHeight: 104, overflowY: 'auto' }}>
            <span className="text-xs font-bold text-slate-500 mr-1">Công đoạn 1</span>
            <button className={'pill ' + (stage === '' ? 'on' : '')} onClick={() => { setStage(''); setPage(1); }}>Tất cả ({rows.length})</button>
            {stageList.map(s => (
              <button key={s.L} className={'pill ' + (stage === s.L ? 'on' : '')} onClick={() => { setStage(s.L); setPage(1); }}>
                {s.label} ({s.count})
              </button>
            ))}
          </div>
        )}
      </div>

      {/* ===== PHẦN CUỘN: chỉ có tem ===== */}
      <div className="kb-scroll" ref={scrollRef} onScroll={onScroll}>
        {loading && <div className="no-print card p-6 text-center text-gray-400">Đang tải…</div>}
        {!loading && !lsx && <div className="no-print card p-6 text-center text-gray-400">Nhập lệnh sản xuất rồi nhấn Enter để hiển thị tem Kanban.</div>}
        {!loading && lsx && filtered.length === 0 && <div className="no-print card p-6 text-center text-gray-400">Không có tem nào.</div>}

        <div className="tem-wrap" style={{ ...printVars, '--ss': scale, '--gap': GAP + 'px' }}>
          {shown.map((r, i) => (
            <div className="tem-page" key={r.id}>
              <span className="tem-no no-print" title="Số tờ in">{i + 1}</span>
              <TemKanban r={r} pkh={pkh[normKey(cell(r, 'A'))]} />
            </div>
          ))}
        </div>

        {!showAll && shown.length < filtered.length && (
          <div className="no-print text-center mt-4">
            <button className="btn" onClick={() => setPage(p => p + 1)}>Xem thêm ({filtered.length - shown.length} tem)</button>
          </div>
        )}
      </div>

            {cfgOpen && (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 no-print" onClick={() => setCfgOpen(false)}>
          <div className="bg-white p-6 rounded-2xl w-full max-w-md shadow-2xl" onClick={e => e.stopPropagation()}>
            <h2 className="text-lg font-bold mb-4"><i className="fa-solid fa-sliders text-primary mr-2"></i>Cấu hình tem Kanban</h2>

            <p className="text-xs font-bold text-slate-500 mb-2">Khổ giấy tem (mm)</p>
            <div className="flex items-center gap-2 mb-2">
              <input type="number" min="30" value={pw} onChange={e => setPw(Number(e.target.value) || 150)} className="inp" style={{ width: 90 }} />
              <span>×</span>
              <input type="number" min="30" value={ph} onChange={e => setPh(Number(e.target.value) || 100)} className="inp" style={{ width: 90 }} />
              <button className="pill" onClick={() => { setPw(150); setPh(100); setRot(false); }}>150×100</button>
            </div>
            <label className="flex items-center gap-2 text-sm cursor-pointer mb-1">
              <input type="checkbox" checked={rot} onChange={e => setRot(e.target.checked)} /> Xoay tem 90°
            </label>
            <p className="text-xs text-gray-400 mb-4">Giấy ngang 150×100 → không xoay; giấy dọc 100×150 → tích “Xoay tem 90°”. Khi in, mỗi tem 1 trang.</p>

            <p className="text-xs font-bold text-slate-500 mb-2">Số tem hiển thị trên 1 hàng</p>
            <div className="flex gap-2 mb-6">
              {[2, 3, 4].map(n => (
                <button key={n} className={'pill ' + (perRow === n ? 'on' : '')} onClick={() => setPerRow(n)}>{n} tem/hàng</button>
              ))}
            </div>

            <div className="flex justify-end">
              <button className="btn btn-primary" onClick={() => setCfgOpen(false)}>Xong</button>
            </div>
          </div>
        </div>
      )}

      {importOpen && <ImportKanbanModal onClose={() => setImportOpen(false)} onDone={() => { setVer(v => v + 1); load(lsx); }} />}
    </div>
  );
}

// =====================================================================
// 8. PHÂN QUYỀN — danh sách người dùng/vai trò thủ công (bảng "NguoiDung")
// =====================================================================
function PhanQuyen() {
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [newName, setNewName] = useState('');
  const roles = ['admin', 'qltx', 'user', 'viewer'];

  useEffect(() => { load(); }, []);

  const load = async () => {
    setLoading(true);
    const { data, error } = await supabase.from('NguoiDung').select('*').order('created_at');
    if (!error) setUsers(data || []);
    setLoading(false);
  };

  const updateRole = async (id, role) => {
    setUsers(prev => prev.map(u => u.id === id ? { ...u, role } : u));
    const { error } = await supabase.from('NguoiDung').update({ role }).eq('id', id);
    if (error) alert('Lỗi cập nhật quyền: ' + error.message);
  };

  const addUser = async () => {
    if (!newName.trim()) return;
    const { error } = await supabase.from('NguoiDung').insert([{ full_name: newName.trim(), role: 'user' }]);
    if (error) alert('Lỗi thêm người dùng: ' + error.message);
    else { setNewName(''); load(); }
  };

  return (
    <div className="space-y-3">
      <div className="card p-3 flex items-center gap-3">
        <input value={newName} onChange={e => setNewName(e.target.value)} onKeyDown={e => e.key === 'Enter' && addUser()} placeholder="Tên người dùng mới…" className="inp" style={{ width: 260 }} />
        <button onClick={addUser} className="btn btn-primary"><i className="fa-solid fa-plus"></i> Thêm</button>
      </div>
      <div className="card overflow-auto">
        <table className="erp">
          <thead><tr><th style={{ textAlign: 'left' }}>Họ tên</th><th style={{ textAlign: 'left' }}>Vai trò</th></tr></thead>
          <tbody>
            {loading ? <tr><td colSpan="2" className="text-center py-6 text-gray-400">Đang tải…</td></tr> :
              users.length === 0 ? <tr><td colSpan="2" className="text-center py-6 text-gray-400">Chưa có người dùng nào.</td></tr> :
              users.map(u => (
                <tr key={u.id}>
                  <td>{u.full_name || '—'}</td>
                  <td>
                    <select value={u.role || 'user'} onChange={e => updateRole(u.id, e.target.value)} className="inp" style={{ padding: '3px 8px' }}>
                      {roles.map(r => <option key={r} value={r}>{r}</option>)}
                    </select>
                  </td>
                </tr>
              ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// =====================================================================
// 9. SIDEBAR (kiểu hình 1, dài hết màn hình, có nút thu/mở) + LAYOUT
// =====================================================================
const MENU = [
  { group: 'Tổng hợp', icon: 'fa-chart-pie', items: [
    { id: 'dashboard', name: 'Dashboard', icon: 'fa-gauge-high' } ] },
  { group: 'Theo dõi sản xuất', icon: 'fa-chart-column', items: [
    { id: 'tracuu', name: 'Tra cứu', icon: 'fa-table-list', badge: 'tracuu' },
    { id: 'bom', name: 'BOM', icon: 'fa-cubes' } ] },
  { group: 'Đơn hàng', icon: 'fa-clipboard-list', items: [
    { id: 'indonhang', name: 'In đơn hàng', icon: 'fa-print' },
    { id: 'kanban', name: 'Kanban', icon: 'fa-tags', badge: 'kanban' } ] },
  { group: 'Hệ thống', icon: 'fa-gear', items: [
    { id: 'phanquyen', name: 'Phân quyền', icon: 'fa-user-shield' } ] },
];

function Sidebar({ currentPage, setCurrentPage, collapsed, setCollapsed, counts }) {
  return (
    <aside className={'sb h-full bg-white border-r border-gray-200 flex flex-col ' + (collapsed ? 'collapsed' : '')}>
      {/* Logo + PRODUCTION CONTROL */}
      <div className="flex flex-col items-center justify-center border-b border-gray-100" style={{ height: 76 }}>
        <Logo collapsed={collapsed} />
        {!collapsed && <h2 className="text-[11px] font-extrabold text-primary tracking-[0.18em] mt-1">PRODUCTION CONTROL</h2>}
      </div>

      <nav className="flex-1 overflow-y-auto py-2">
        {MENU.map(g => (
          <div key={g.group}>
            <div className="sb-group" title={g.group}>
              <i className={`fa-solid ${g.icon}`}></i>{!collapsed && <span>{g.group}</span>}
            </div>
            {g.items.map(item => (
              <div key={item.id} title={item.name} onClick={() => setCurrentPage(item.id)}
                   className={'sb-item ' + (currentPage === item.id ? 'on' : '')}>
                <i className={`fa-solid ${item.icon}`}></i>
                {!collapsed && <span>{item.name}</span>}
                {!collapsed && item.badge && counts[item.badge] != null && <span className="sb-badge">{Number(counts[item.badge]).toLocaleString('vi-VN')}</span>}
              </div>
            ))}
          </div>
        ))}
      </nav>

      {/* Nút thu / mở sidebar ở cuối */}
      <button className="sb-toggle" onClick={() => setCollapsed(!collapsed)} title={collapsed ? 'Mở rộng menu' : 'Thu gọn menu'}>
        <i className={`fa-solid ${collapsed ? 'fa-angles-right' : 'fa-angles-left'}`}></i>
        {!collapsed && <span>Thu gọn menu</span>}
      </button>
    </aside>
  );
}

function MainApp() {
  const [currentPage, setCurrentPage] = useState('dashboard');
  const [collapsed, setCollapsed] = useState(() => { try { return localStorage.getItem('sb_collapsed') === '1'; } catch (e) { return false; } });
  const [counts, setCounts] = useState({});
  const [visited, setVisited] = useState({});          // tab nào đã mở thì giữ lại (ẩn đi chứ không huỷ) để không mất lệnh đang chọn
  useEffect(() => { setVisited(v => v[currentPage] ? v : { ...v, [currentPage]: true }); }, [currentPage]);

  useEffect(() => { try { localStorage.setItem('sb_collapsed', collapsed ? '1' : '0'); } catch (e) {} }, [collapsed]);

  useEffect(() => {
    (async () => {
      const a = await supabase.from(TB_BOM).select('*', { count: 'exact', head: true });
      const b = await supabase.from(TB_KANBAN).select('*', { count: 'exact', head: true });
      setCounts({ tracuu: a.count, kanban: b.count });
    })();
  }, []);

  return (
    <div className="app-shell flex h-screen overflow-hidden">
      <div className="no-print h-screen"><Sidebar currentPage={currentPage} setCurrentPage={setCurrentPage} collapsed={collapsed} setCollapsed={setCollapsed} counts={counts} /></div>
      <div className="app-col flex-1 flex flex-col min-w-0 h-screen">
        <header className="no-print h-14 flex items-center justify-end gap-3 px-6 bg-white border-b border-gray-200">
          <span className="text-xs font-semibold text-slate-600"><i className="fa-solid fa-user mr-1.5 text-primary"></i>Admin</span>
          <button className="btn" onClick={() => location.reload()}><i className="fa-solid fa-rotate"></i> Làm mới</button>
        </header>
        <main className="app-main flex-1 overflow-y-auto p-5">
          {currentPage === 'dashboard' && <Dashboard />}
          {currentPage === 'tracuu' && <TraCuu />}
          {currentPage === 'bom' && <Bom />}
          {visited.indonhang && <div style={{ display: currentPage === 'indonhang' ? 'block' : 'none' }}><InDonHang /></div>}
          {visited.kanban && <div style={{ display: currentPage === 'kanban' ? 'block' : 'none' }}><Kanban active={currentPage === 'kanban'} /></div>}
          {currentPage === 'phanquyen' && <PhanQuyen />}
        </main>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<MainApp />);
</script>
</body>
</html>
