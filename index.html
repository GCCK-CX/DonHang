        const editing = ed && ed.c === c;
        return (
          <td key={c} className={(orig && orig[c] !== v ? 'dirty ' : '') + (actC === c ? 'act ' : '') + (editing ? 'ed' : '')}
              onMouseDown={e => H.current.down(e, r, c)} onDoubleClick={() => H.current.edit(r, c, false)}>
            {editing
              ? <input className="xg-in" autoFocus value={ed.v}
                  onFocus={e => { if (ed.sel) e.target.select(); }}
                  onChange={e => H.current.edChange(e.target.value)}
                  onKeyDown={e => H.current.edKey(e)}
                  onBlur={() => H.current.edBlur()} />
              : v}
          </td>
        );
      })}
    </tr>
  );
});

function SheetGrid({ store, onChange, canAdd }) {
  const boxRef = useRef(null), headRef = useRef(null);
  const [scrollTop, setScrollTop] = useState(0);
  const [vh, setVh] = useState(600);
  const [act, setAct] = useState({ r: 0, c: 0 });
  const [ed, setEd] = useState(null);
  const [drag, setDrag] = useState(null);
  const edRef = useRef(null), dragRef = useRef(null), H = useRef({});
  const winMove = useRef((e) => H.current.move(e)).current;
  const winUp = useRef(() => H.current.up()).current;
  const n = store.data.length;
  const headH = () => (headRef.current ? headRef.current.offsetHeight : 68);

  useEffect(() => {
    const el = boxRef.current; if (!el) return;
    const m = () => { if (el.clientHeight > 0) setVh(el.clientHeight); };
    m(); const ro = new ResizeObserver(m); ro.observe(el);
    return () => {
      ro.disconnect();
      if (dragRef.current) clearInterval(dragRef.current.timer);
      window.removeEventListener('mousemove', winMove); window.removeEventListener('mouseup', winUp);
    };
  }, []);

  // ---------- dữ liệu ----------
  const refreshDirty = (r) => {
    if (!store.orig) return;
    const o = store.orig[r], d = store.data[r];
    const diff = !o || d.some((x, i) => x !== o[i]);
    if (diff) store.dirty.add(r); else store.dirty.delete(r);
  };
  const applyRows = (map) => {                               // map: Map(r -> dòng mới). Lưu dòng cũ để hoàn tác
    const snap = [];
    map.forEach((row, r) => { snap.push({ r, row: store.data[r] }); store.data[r] = row; refreshDirty(r); });
    store.undo.push(snap); if (store.undo.length > 100) store.undo.shift();
    onChange();
  };
  const setCell = (r, c, v) => {
    if (store.data[r][c] === v) return;
    const row = store.data[r].slice(); row[c] = v; applyRows(new Map([[r, row]]));
  };
  const undo = () => {
    const snap = store.undo.pop(); if (!snap) return;
    snap.forEach(({ r, row }) => { if (r < store.data.length) { store.data[r] = row; refreshDirty(r); } });
    onChange();
  };

  // ---------- di chuyển ----------
  const ensureVisible = (r, c) => {
    const el = boxRef.current; if (!el) return;
    const hh = headH(), top = hh + r * BK_RH;
    if (top < el.scrollTop + hh) el.scrollTop = top - hh;
    else if (top + BK_RH > el.scrollTop + el.clientHeight) el.scrollTop = top + BK_RH - el.clientHeight;
    const left = BK_LEFT[c], w = BK_COLW[c];
    if (left < el.scrollLeft + BK_RNW) el.scrollLeft = left - BK_RNW;
    else if (left + w > el.scrollLeft + el.clientWidth) el.scrollLeft = left + w - el.clientWidth;
  };
  const moveTo = (r, c) => {
    r = Math.max(0, Math.min(store.data.length - 1, r)); c = Math.max(0, Math.min(BK_N - 1, c));
    setAct({ r, c }); ensureVisible(r, c);
  };

  // ---------- sửa ô ----------
  const startEdit = (r, c, selAll) => { const e = { r, c, v: store.data[r][c], sel: !!selAll }; edRef.current = e; setEd(e); };
  const edChange = (v) => { const e = { ...edRef.current, v, sel: false }; edRef.current = e; setEd(e); };
  const finishEdit = (save, dr, dc, focusBack) => {
    const e = edRef.current; if (!e) return;
    edRef.current = null; setEd(null);
    if (save) {
      const old = store.data[e.r][e.c];
      if (e.v !== old && e.v !== old.replace(/[\r\n]+/g, '')) setCell(e.r, e.c, e.v);   // ô có xuống dòng mà không gõ gì thì giữ nguyên
    }
    if (dr || dc) moveTo(e.r + dr, e.c + dc);
    if (focusBack && boxRef.current) boxRef.current.focus({ preventScroll: true });
  };
  const edKey = (e) => {
    if (e.nativeEvent.isComposing) return;
    if (e.key === 'Enter') { e.preventDefault(); finishEdit(true, e.shiftKey ? -1 : 1, 0, true); }
    else if (e.key === 'Tab') { e.preventDefault(); finishEdit(true, 0, e.shiftKey ? -1 : 1, true); }
    else if (e.key === 'Escape') { e.preventDefault(); finishEdit(false, 0, 0, true); }
  };
  const edBlur = () => { if (edRef.current) finishEdit(true, 0, 0, false); };

  // ---------- chuột: chọn ô / kéo chọn nhiều dòng ----------
  const rowAt = (y) => {
    const el = boxRef.current, rect = el.getBoundingClientRect();
    const yy = y - rect.top + el.scrollTop - headH();
    return Math.max(0, Math.min(store.data.length - 1, Math.floor(yy / BK_RH)));
  };
  const down = (e, r, c) => {
    if (e.button !== 0) return;
    const cur = edRef.current;
    if (cur && cur.r === r && cur.c === c) return;            // đang gõ trong chính ô này
    if (cur) finishEdit(true, 0, 0, false);
    if (c >= 0) setAct({ r, c });
    boxRef.current.focus({ preventScroll: true });
    dragRef.current = { a: r, b: r, y: e.clientY, mode: store.sel.has(r) ? 'remove' : 'add', rowNo: c < 0 };
    window.addEventListener('mousemove', winMove); window.addEventListener('mouseup', winUp);
    dragRef.current.timer = setInterval(() => H.current.tick(), 40);
  };
  const move = (e) => { if (dragRef.current) dragRef.current.y = e.clientY; };
  const tick = () => {
    const d = dragRef.current; if (!d) return;
    const el = boxRef.current, rect = el.getBoundingClientRect();
    if (d.y > rect.bottom - 20) el.scrollTop += 30;           // kéo sát mép dưới/trên thì tự cuộn
    else if (d.y < rect.top + headH() + 10) el.scrollTop -= 30;
    const b = rowAt(d.y);
    if (b !== d.b) { d.b = b; setDrag({ a: d.a, b, mode: d.mode }); }
  };
  const up = () => {
    const d = dragRef.current; if (!d) return;
    clearInterval(d.timer); dragRef.current = null;
    window.removeEventListener('mousemove', winMove); window.removeEventListener('mouseup', winUp);
    setDrag(null);
    if (d.a !== d.b) {                                        // kéo qua nhiều dòng: chọn (hoặc bỏ chọn nếu bắt đầu từ dòng đang chọn)
      const lo = Math.min(d.a, d.b), hi = Math.max(d.a, d.b);
      for (let r = lo; r <= hi; r++) { if (d.mode === 'add') store.sel.add(r); else store.sel.delete(r); }
      onChange();
    } else if (d.rowNo) {                                     // bấm số dòng: đảo chọn 1 dòng
      if (store.sel.has(d.a)) store.sel.delete(d.a); else store.sel.add(d.a);
      onChange();
    }
  };

  // ---------- bàn phím / clipboard ----------
  const onKey = (e) => {
    if (e.target.tagName === 'INPUT' || !n) return;
    if (e.ctrlKey || e.metaKey) { if (e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); } return; }
    const { r, c } = act;
    const go = (dr, dc) => { e.preventDefault(); moveTo(r + dr, c + dc); };
    switch (e.key) {
      case 'ArrowDown': return go(1, 0);
      case 'ArrowUp': return go(-1, 0);
      case 'ArrowLeft': return go(0, -1);
      case 'ArrowRight': return go(0, 1);
      case 'Tab': return go(0, e.shiftKey ? -1 : 1);
      case 'PageDown': return go(15, 0);
      case 'PageUp': return go(-15, 0);
      case 'Home': return go(0, -c);
      case 'End': return go(0, BK_N - 1 - c);
      case 'Enter': case 'F2': e.preventDefault(); return startEdit(r, c, false);
      case 'Delete': case 'Backspace': e.preventDefault(); return setCell(r, c, '');
      case 'Escape': if (store.sel.size) { store.sel.clear(); onChange(); } return;
      default:
        if (e.key.length === 1 || e.key === 'Process' || e.key === 'Unidentified') startEdit(r, c, true);   // gõ thẳng để thay nội dung ô
    }
  };
  const onCopy = (e) => {
    if (e.target.tagName === 'INPUT' || !n) return;
    const text = store.sel.size
      ? Array.from(store.sel).sort((a, b) => a - b).map(r => store.data[r].map(tsvQ).join('\t')).join('\n')
      : tsvQ(store.data[act.r][act.c]);
    e.clipboardData.setData('text/plain', text); e.preventDefault();
  };
  const onPaste = (e) => {
    if (e.target.tagName === 'INPUT') return;
    e.preventDefault();
    const text = e.clipboardData.getData('text'); if (!text || !n) return;
    const m = parseTSV(text), r0 = act.r, c0 = act.c;
    let skipped = 0;
    const need = r0 + m.length - store.data.length;
    if (need > 0) { if (canAdd) { for (let k = 0; k < need; k++) store.data.push(blankRow()); } else skipped = need; }
    const map = new Map();
    m.forEach((line, i) => {
      const r = r0 + i; if (r >= store.data.length) return;
      const row = store.data[r].slice();
      line.forEach((v, j) => { if (c0 + j < BK_N) row[c0 + j] = v; });
      map.set(r, row);
    });
    applyRows(map);
    if (skipped) alert('Đã bỏ qua ' + skipped + ' dòng cuối vì vượt quá số dòng đang hiển thị. Muốn thêm dòng mới hãy dùng nút Import.');
  };

  H.current = { down, edit: startEdit, edChange, edKey, edBlur, move, up, tick };

  // ---------- vẽ (chỉ vẽ các dòng đang nhìn thấy) ----------
  const first = Math.max(0, Math.floor(scrollTop / BK_RH) - 6);
  const last = Math.min(n, first + Math.ceil(vh / BK_RH) + 14);
  const dragOn = drag && drag.a !== drag.b;
  const lo = dragOn ? Math.min(drag.a, drag.b) : 0, hi = dragOn ? Math.max(drag.a, drag.b) : -1;
  const isSel = (r) => (dragOn && r >= lo && r <= hi) ? drag.mode === 'add' : store.sel.has(r);

  return (
    <div ref={boxRef} className="xg-box" tabIndex={0} onScroll={e => setScrollTop(e.currentTarget.scrollTop)}
         onKeyDown={onKey} onCopy={onCopy} onPaste={onPaste}>
      <table className="xg" style={{ width: BK_TOTALW }}>
        <colgroup><col style={{ width: BK_RNW }} />{BK_COLW.map((w, i) => <col key={i} style={{ width: w }} />)}</colgroup>
        <thead ref={headRef}>
          <tr className="h1">
            <th className="rn" title="Chọn / bỏ chọn tất cả"
                onClick={() => { if (store.sel.size === n) store.sel.clear(); else for (let i = 0; i < n; i++) store.sel.add(i); onChange(); }}>#</th>
            {BK_LETTERS.map(L => <th key={L}>{L}</th>)}
          </tr>
          <tr className="h2">
            <th className="rn"></th>
            {BK_HEAD.map((h, i) => <th key={i} title={BK_LETTERS[i] + ': ' + h}>{h}</th>)}
          </tr>
        </thead>
        <tbody>
          {first > 0 && <tr><td colSpan={BK_N + 1} style={{ height: first * BK_RH, padding: 0, border: 0 }}></td></tr>}
          {Array.from({ length: Math.max(0, last - first) }, (_, k) => {
            const r = first + k;
            return <XRow key={r} r={r} row={store.data[r]} orig={store.orig ? store.orig[r] : null} sel={isSel(r)}
                         actC={act.r === r ? act.c : -1} ed={ed && ed.r === r ? ed : null}
                         no={store.nums.length ? store.nums[r] : r + 1} H={H} />;
          })}
          {last < n && <tr><td colSpan={BK_N + 1} style={{ height: (n - last) * BK_RH, padding: 0, border: 0 }}></td></tr>}
        </tbody>
      </table>
    </div>
  );
}

  // ----- Tìm LSX -----
  const search = async (val) => {

      const arr = data.map(d => BK_LETTERS.map(L => { const x = d['col_' + L.toLowerCase()]; return x == null ? '' : String(x); }));
      E.data = arr; E.orig = arr.slice(); E.ids = data.map(d => d.id); E.nums = data.map(d => d.sheet_row);
      E.sel = new Set(); E.dirty = new Set(); E.undo = []; E.loaded = v;
      setGk(k => k + 1);
    } catch (e) { bad('Lỗi tải dữ liệu: ' + e.message); }
    setLoading(false);
  };

    // ----- Lưu các dòng đã sửa: Supabase trước, rồi sang Google Sheet (chỉ các ô đã đổi) -----
  const saveEdit = async () => {
    const idx = Array.from(E.dirty).sort((a, b) => a - b); if (!idx.length) return;
    const yes = await ask({ icon: 'fa-floppy-disk', title: 'Lưu thay đổi',
      message: 'Dữ liệu được lưu vào Supabase trước, sau đó đồng bộ sang Google Sheet (chỉ ghi các ô đã sửa).',
      chips: ['LSX: ' + E.loaded, idx.length + ' dòng'], confirmText: 'Lưu & đồng bộ' });
    if (!yes) return;
    setMsg(null);
    try {
      let done = 0;
      for (let s = 0; s < idx.length; s += 200) {
        setBusy('Đang lưu Supabase… ' + Math.min(s + 200, idx.length) + '/' + idx.length);
        const part = idx.slice(s, s + 200).map(r => [E.ids[r], E.nums[r]].concat(E.data[r]));
        const { data, error } = await supabase.rpc('bkx_save', { p_rows: part });
        if (error) throw new Error(/lsx_key|duplicate/i.test(error.message) ? 'Trùng khoá LSX-STT với một dòng khác — hãy đổi lại LSX/STT.' : error.message);
        done += data.updated;
      }
      try {
        for (let s = 0; s < idx.length; s += 200) {
          setBusy('Đang đồng bộ sang Google Sheet… ' + Math.min(s + 200, idx.length) + '/' + idx.length);
          await gs('upsert', { items: idx.slice(s, s + 200).map(r => ({
            key: bkKey(E.data[r], E.nums[r]), oldKey: bkKey(E.orig[r], E.nums[r]),
            values: E.data[r], cols: diffCols(E.orig[r], E.data[r]) })) });
        }
      } catch (e) {
        bad('Đã lưu Supabase nhưng CHƯA ghi sang Google Sheet: ' + (e.message || e) + '. Hãy bấm "Lưu thay đổi" lần nữa để thử lại — nếu bỏ qua, lần đồng bộ Sheet→Supabase sau có thể ghi đè lại chỉnh sửa này.');
        setBusy(''); re(); return;
      }
      idx.forEach(r => { E.orig[r] = E.data[r]; }); E.dirty.clear();
      if (done < idx.length) bad('Đã lưu ' + done + '/' + idx.length + ' dòng trên Supabase. Số còn lại không tìm thấy (có thể vừa được đồng bộ lại) — hãy bấm Tìm lại.');
      else ok('✔ Đã lưu ' + done + ' dòng vào Supabase và đồng bộ sang Google Sheet.');
      window.dispatchEvent(new Event('bk-changed'));
    } catch (e) { bad('Lưu thất bại: ' + (e.message || e)); }
    setBusy(''); re();
  };

  // ----- Xoá các dòng đang chọn: chọn nơi xoá (Supabase / Sheet / cả hai) -----
  const deleteSel = async () => {
    const idx = Array.from(E.sel).sort((a, b) => a - b); if (!idx.length) return;
    const target = await ask({ danger: true, icon: 'fa-trash-can', title: 'Xác nhận xoá BOM',
      message: 'Chọn nơi cần xoá các dòng BOM đã chọn:',
      chips: ['LSX: ' + E.loaded, idx.length + ' dòng'], def: 'both',
      options: [
        { v: 'both', label: 'Xoá cả Supabase và Google Sheet', desc: 'Khuyên dùng — dữ liệu hai nơi luôn khớp nhau.' },
        { v: 'sb', label: 'Chỉ xoá trên Supabase', desc: 'Dòng vẫn còn trên Sheet nên lần đồng bộ sau sẽ được nạp lại.' },
        { v: 'gs', label: 'Chỉ xoá trên Google Sheet', desc: 'Lần đồng bộ sau sẽ xoá nốt các dòng này trên Supabase.' } ],
      warn: 'Thao tác này không thể hoàn tác.', confirmText: 'Xác nhận xoá' });
    if (!target) return;
    setMsg(null);
    try {
      let gsN = 0;
      if (target !== 'sb') {                                   // Sheet trước: nếu Supabase lỗi thì lần đồng bộ sau tự dọn tiếp
        setBusy('Đang xoá trên Google Sheet…');
        const keys = idx.map(r => bkKey(E.orig[r], E.nums[r]));
        for (let s = 0; s < keys.length; s += 5000) gsN += (await gs('delete', { keys: keys.slice(s, s + 5000) })).deleted;
      }
      if (target !== 'gs') {
        setBusy('Đang xoá trên Supabase…');
        for (let s = 0; s < idx.length; s += 500) {
          const { error } = await supabase.rpc('bkx_remove', { p_ids: idx.slice(s, s + 500).map(r => E.ids[r]) });
          if (error) throw error;
        }
        const keep = E.data.map((_, i) => i).filter(i => !E.sel.has(i));
        const oldDirty = E.dirty;
        E.data = keep.map(i => E.data[i]); E.orig = keep.map(i => E.orig[i]);
        E.ids = keep.map(i => E.ids[i]); E.nums = keep.map(i => E.nums[i]);
        E.dirty = new Set(); keep.forEach((o, nI) => { if (oldDirty.has(o)) E.dirty.add(nI); });
      }
      E.sel = new Set(); E.undo = [];
      ok('✔ Đã xoá ' + idx.length + ' dòng' + (target === 'both' ? ' trên Supabase và ' + gsN + ' dòng trên Google Sheet.' : target === 'sb' ? ' trên Supabase.' : ' — Google Sheet: ' + gsN + ' dòng.'));
      window.dispatchEvent(new Event('bk-changed'));
      setGk(k => k + 1);
    } catch (e) { bad('Xoá thất bại: ' + (e.message || e)); }
    setBusy(''); re();
  };

  // ----- Import: ghi Supabase trước, rồi đồng bộ xuống Google Sheet -----
  const importFilled = () => I.data.map((r, i) => ({ r, i })).filter(x => x.r.some(v => String(v).trim() !== ''));
  const saveImport = async () => {
    const rows = importFilled();
    if (!rows.length) return alert('Chưa có dữ liệu để lưu.');
    const miss = rows.filter(x => !bkTrim(x.r[0]) || !bkTrim(x.r[1]));
    if (miss.length) return alert('Có ' + miss.length + ' dòng thiếu Lệnh sản xuất (cột A) hoặc STT (cột B), ví dụ dòng ' + miss.slice(0, 5).map(x => x.i + 1).join(', ') + '. Hãy điền hoặc xoá các dòng này.');
    const lastIdx = new Map(); rows.forEach((x, k) => lastIdx.set(bkKey(x.r, 0), k));
    const uniq = rows.filter((x, k) => lastIdx.get(bkKey(x.r, 0)) === k);        // trùng khoá LSX-STT: giữ dòng sau cùng
    const dup = rows.length - uniq.length;
    const yes = await ask({ icon: 'fa-file-import', title: 'Thêm dòng mới',
      message: 'Dữ liệu được ghi vào Supabase trước, sau đó đồng bộ xuống Google Sheet.',
      chips: [uniq.length + ' dòng'].concat(dup ? [dup + ' dòng trùng khoá LSX-STT (giữ dòng sau cùng)'] : []), confirmText: 'Lưu & đồng bộ' });
    if (!yes) return;
    setMsg(null);
    try {
      for (let s = 0; s < uniq.length; s += 200) {
        setBusy('Đang ghi Supabase… ' + Math.min(s + 200, uniq.length) + '/' + uniq.length);
        const { error } = await supabase.rpc('bkx_save', { p_rows: uniq.slice(s, s + 200).map(x => [null, null].concat(x.r.map(String))) });
        if (error) throw error;
      }
    } catch (e) { bad('Lưu Supabase thất bại: ' + (e.message || e)); setBusy(''); return; }
    try {
      for (let s = 0; s < uniq.length; s += 400) {
        setBusy('Đang đồng bộ xuống Google Sheet… ' + Math.min(s + 400, uniq.length) + '/' + uniq.length);
        await gs('upsert', { items: uniq.slice(s, s + 400).map(x => ({ key: bkKey(x.r, 0), values: x.r.map(String), cols: null })) });
      }
    } catch (e) {
      bad('Đã ghi Supabase nhưng GHI SHEET LỖI: ' + (e.message || e) + '. Dữ liệu vẫn còn trong bảng — hãy bấm Lưu lần nữa để thử lại (nếu bỏ qua, lần đồng bộ Sheet→Supabase sau sẽ xoá các dòng này khỏi Supabase).');
      setBusy(''); return;
    }
    const firstLsx = String(rows[0].r[0]).trim();
    I.data = Array.from({ length: 30 }, blankRow); I.sel = new Set(); I.undo = [];
    ok('✔ Đã thêm ' + uniq.length + ' dòng vào Supabase và Google Sheet.');
    window.dispatchEvent(new Event('bk-changed'));
    setMode('edit'); setInput(firstLsx); setGk(k => k + 1); setBusy('');
    E.dirty = new Set(); search(firstLsx);
  };

  // ----- Đưa 5 dòng cuối cùng trong Supabase lên bảng Import -----
  const loadLast5 = async () => {
    if (importFilled().length && !(await ask({ icon: 'fa-clock-rotate-left', title: 'Thay nội dung bảng?',
      message: 'Bảng đang có dữ liệu chưa lưu. Đưa 5 dòng cuối lên sẽ thay thế toàn bộ nội dung này.', confirmText: 'Thay thế' }))) return;
    setBusy('Đang tải 5 dòng cuối…'); setMsg(null);
    try {
      const { data, error } = await supabase.from(TB_KANBAN).select('*')
        .order('sheet_row', { ascending: false, nullsFirst: true }).order('id', { ascending: false }).limit(5);
      if (error) throw error;
      const arr = data.reverse().map(d => BK_LETTERS.map(L => { const x = d['col_' + L.toLowerCase()]; return x == null ? '' : String(x); }));
      I.data = arr.concat(Array.from({ length: 25 }, blankRow)); I.sel = new Set(); I.undo = [];
      setGk(k => k + 1); ok('✔ Đã đưa ' + arr.length + ' dòng cuối cùng của Supabase lên bảng.');
    } catch (e) { bad('Không tải được: ' + (e.message || e)); }
    setBusy('');
  };
  const addRows = () => { for (let k = 0; k < 100; k++) I.data.push(blankRow()); re(); };
  const clearImport = () => { if (!confirm('Xoá toàn bộ nội dung đang dán?')) return; I.data = Array.from({ length: 30 }, blankRow); I.sel = new Set(); I.undo = []; setGk(k => k + 1); };
  const delLocal = () => { const keep = I.data.filter((_, i) => !I.sel.has(i)); I.data = keep.length ? keep : [blankRow()]; I.sel = new Set(); I.undo = []; setGk(k => k + 1); };

  const dis = (b) => ({ disabled: b || !!busy, style: { opacity: (b || busy) ? .5 : 1 } });

  return (
    <div className="bk-root">
      <div className="no-print space-y-3 pb-3" style={{ flex: '0 0 auto' }}>
        <div className="card p-3 flex flex-wrap items-center gap-3">
          {mode === 'edit' ? (<>
            <span className="text-xs font-bold text-slate-500">Lệnh sản xuất</span>
            <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && search()}
              placeholder="Nhập lệnh sản xuất rồi nhấn Enter…" className="inp" style={{ width: 280 }} />
            <button className="btn btn-primary" onClick={() => search()}><i className="fa-solid fa-magnifying-glass"></i> Tìm</button>
            {E.loaded && <span className="text-xs text-slate-500">{E.data.length} dòng · <b className="text-amber-600">{E.dirty.size} dòng đã sửa</b> · <b className="text-red-600">{E.sel.size} dòng đang chọn</b></span>}
            <button className="btn ml-auto" onClick={() => setMode('import')}><i className="fa-solid fa-file-import"></i> Import</button>
            <button className="btn btn-red" onClick={deleteSel} {...dis(!E.sel.size)}><i className="fa-solid fa-trash"></i> Xoá dòng đã chọn ({E.sel.size})</button>
            <button className="btn btn-green" onClick={saveEdit} {...dis(!E.dirty.size)}><i className="fa-solid fa-floppy-disk"></i> Lưu thay đổi ({E.dirty.size})</button>
          </>) : (<>
            <button className="btn" onClick={() => setMode('edit')}><i className="fa-solid fa-arrow-left"></i> Quay lại</button>
            <span className="font-bold text-slate-700 text-sm">Import BOM Kanban</span>
            <span className="text-xs text-slate-500">{importFilled().length} dòng có dữ liệu · {I.sel.size} dòng đang chọn</span>
            <button className="btn ml-auto" onClick={loadLast5} {...dis(false)}><i className="fa-solid fa-clock-rotate-left"></i> 5 dòng cuối</button>
            <button className="btn" onClick={addRows}><i className="fa-solid fa-plus"></i> Thêm 100 dòng</button>
            <button className="btn" onClick={delLocal} {...dis(!I.sel.size)}><i className="fa-solid fa-eraser"></i> Bỏ dòng đã chọn</button>
            <button className="btn" onClick={clearImport}>Xoá hết</button>
            <button className="btn btn-green" onClick={saveImport} {...dis(!importFilled().length)}><i className="fa-solid fa-floppy-disk"></i> Lưu vào Supabase</button>
          </>)}
        </div>
        <p className="text-xs text-gray-400 px-1">
          {mode === 'edit'
            ? 'Click ô để chọn · gõ hoặc F2/nhấp đúp để sửa · Ctrl+C / Ctrl+V · Ctrl+Z hoàn tác · Delete xoá ô · Kéo chuột qua nhiều dòng để chọn (đỏ nhạt), kéo lại lần nữa để bỏ chọn.'
            : 'Chọn ô A1 rồi Ctrl+V để dán dữ liệu từ Excel / Google Sheet (cột A → FA). Dòng nào có dữ liệu sẽ được thêm mới; cột A (Lệnh sản xuất) là bắt buộc.'}
        </p>
        {busy && <div className="card p-3 text-sm text-blue-700 bg-blue-50">{busy}</div>}
        {msg && <div className={'card p-3 text-sm ' + (msg.t === 'err' ? 'text-red-700 bg-red-50' : 'text-green-700 bg-green-50')}>{msg.s}</div>}
      </div>

      <div style={{ flex: '1 1 auto', minHeight: 0, display: 'flex', flexDirection: 'column' }}>
        {mode === 'edit' && loading && <div className="card p-6 text-center text-gray-400">Đang tải…</div>}
        {mode === 'edit' && !loading && !E.loaded && <div className="card p-6 text-center text-gray-400">Nhập lệnh sản xuất rồi nhấn Enter để hiển thị dữ liệu cần sửa.</div>}
        {mode === 'edit' && !loading && E.loaded && !E.data.length && <div className="card p-6 text-center text-gray-400">Không tìm thấy lệnh sản xuất “{E.loaded}”.</div>}
        {mode === 'edit' && !loading && E.data.length > 0 && <SheetGrid key={'e' + gk} store={E} onChange={re} canAdd={false} />}
        {mode === 'import' && <SheetGrid key={'i' + gk} store={I} onChange={re} canAdd={true} />}
      </div>

      {dlg && (
        <div className="no-print" onMouseDown={() => closeDlg(false)}
             style={{ position: 'fixed', inset: 0, zIndex: 100, display: 'flex', alignItems: 'center', justifyContent: 'center',
                      background: 'rgba(15,23,42,.55)', backdropFilter: 'blur(3px)' }}>
          <div className="dlg" onMouseDown={e => e.stopPropagation()}>
            <div className={'dlg-ico ' + (dlg.danger ? 'red' : 'blue')}><i className={'fa-solid ' + (dlg.icon || 'fa-circle-question')}></i></div>
            <h3 className="dlg-title">{dlg.title}</h3>
            <p className="dlg-msg">{dlg.message}</p>
            {dlg.chips && <div className="dlg-chips">{dlg.chips.map((c, i) => <span key={i} className="dlg-chip">{c}</span>)}</div>}
            {dlg.options && (
              <div style={{ marginTop: 16, textAlign: 'left', display: 'grid', gap: 8 }}>
                {dlg.options.map(o => (
                  <div key={o.v} className={'dlg-opt' + (pick === o.v ? ' on' : '')} onClick={() => setPick(o.v)}>
                    <span className="dlg-radio"></span>
                    <span><b>{o.label}</b><small>{o.desc}</small></span>
                  </div>
                ))}
              </div>
            )}
            {dlg.warn && <div className="dlg-warn"><i className="fa-solid fa-triangle-exclamation"></i> {dlg.warn}</div>}
            <div className="dlg-act">
              <button className="btn" onClick={() => closeDlg(false)}>Hủy</button>
              <button className={'btn ' + (dlg.danger ? 'btn-red' : 'btn-primary')} autoFocus onClick={() => closeDlg(true)}>{dlg.confirmText || 'Đồng ý'}</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// =====================================================================
// 8. PHÂN QUYỀN — danh sách người dùng/vai trò thủ công (bảng "NguoiDung")
// =====================================================================
function PhanQuyen() {
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [newName, setNewName] = useState('');
  const roles = ['admin', 'qltx', 'user', 'viewer'];

  useEffect(() => { load(); }, []);

  const load = async () => {
    setLoading(true);
    const { data, error } = await supabase.from('NguoiDung').select('*').order('created_at');
    if (!error) setUsers(data || []);
    setLoading(false);
  };

  const updateRole = async (id, role) => {
    setUsers(prev => prev.map(u => u.id === id ? { ...u, role } : u));
    const { error } = await supabase.from('NguoiDung').update({ role }).eq('id', id);
    if (error) alert('Lỗi cập nhật quyền: ' + error.message);
  };

  const addUser = async () => {
    if (!newName.trim()) return;
    const { error } = await supabase.from('NguoiDung').insert([{ full_name: newName.trim(), role: 'user' }]);
    if (error) alert('Lỗi thêm người dùng: ' + error.message);
    else { setNewName(''); load(); }
  };

  return (
    <div className="space-y-3">
      <div className="card p-3 flex items-center gap-3">
        <input value={newName} onChange={e => setNewName(e.target.value)} onKeyDown={e => e.key === 'Enter' && addUser()} placeholder="Tên người dùng mới…" className="inp" style={{ width: 260 }} />
        <button onClick={addUser} className="btn btn-primary"><i className="fa-solid fa-plus"></i> Thêm</button>
      </div>
      <div className="card overflow-auto">
        <table className="erp">
          <thead><tr><th style={{ textAlign: 'left' }}>Họ tên</th><th style={{ textAlign: 'left' }}>Vai trò</th></tr></thead>
          <tbody>
            {loading ? <tr><td colSpan="2" className="text-center py-6 text-gray-400">Đang tải…</td></tr> :
              users.length === 0 ? <tr><td colSpan="2" className="text-center py-6 text-gray-400">Chưa có người dùng nào.</td></tr> :
              users.map(u => (
                <tr key={u.id}>
                  <td>{u.full_name || '—'}</td>
                  <td>
                    <select value={u.role || 'user'} onChange={e => updateRole(u.id, e.target.value)} className="inp" style={{ padding: '3px 8px' }}>
                      {roles.map(r => <option key={r} value={r}>{r}</option>)}
                    </select>
                  </td>
                </tr>
              ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

}

function MainApp() {
  const [currentPage, setCurrentPage] = useState('dashboard');
  const [collapsed, setCollapsed] = useState(() => { try { return localStorage.getItem('sb_collapsed') === '1'; } catch (e) { return false; } });
  const [counts, setCounts] = useState({});
  const [visited, setVisited] = useState({});          // tab nào đã mở thì giữ lại (ẩn đi chứ không huỷ) để không mất lệnh đang chọn
  useEffect(() => { setVisited(v => v[currentPage] ? v : { ...v, [currentPage]: true }); }, [currentPage]);

  useEffect(() => { try { localStorage.setItem('sb_collapsed', collapsed ? '1' : '0'); } catch (e) {} }, [collapsed]);

  useEffect(() => {
    let alive = true;
    const refresh = async () => {
      if (document.hidden) return;
      try {
        const a = await supabase.from(TB_BOM).select('*', { count: 'exact', head: true });
        const b = await supabase.from(TB_KANBAN).select('*', { count: 'exact', head: true });
        if (alive) setCounts({ tracuu: a.count, kanban: b.count });
      } catch (e) {}
    };
    refresh();
    const t = setInterval(refresh, 15000);
    window.addEventListener('bk-changed', refresh);
    document.addEventListener('visibilitychange', refresh);
    return () => { alive = false; clearInterval(t); window.removeEventListener('bk-changed', refresh); document.removeEventListener('visibilitychange', refresh); };
  }, []);

  return (
    <div className="app-shell flex h-screen overflow-hidden">
      <div className="no-print h-screen"><Sidebar currentPage={currentPage} setCurrentPage={setCurrentPage} collapsed={collapsed} setCollapsed={setCollapsed} counts={counts} /></div>
      <div className="app-col flex-1 flex flex-col min-w-0 h-screen">
        <header className="no-print h-14 flex items-center justify-end gap-3 px-6 bg-white border-b border-gray-200">
          <span className="text-xs font-semibold text-slate-600"><i className="fa-solid fa-user mr-1.5 text-primary"></i>Admin</span>
          <button className="btn" onClick={() => location.reload()}><i className="fa-solid fa-rotate"></i> Làm mới</button>
        </header>
        <main className="app-main flex-1 overflow-y-auto p-5">
          {currentPage === 'dashboard' && <Dashboard />}
          {currentPage === 'tracuu' && <TraCuu />}
          {currentPage === 'bom' && <Bom />}
          {visited.indonhang && <div style={{ display: currentPage === 'indonhang' ? 'block' : 'none' }}><InDonHang /></div>}
          {visited.kanban && <div style={{ display: currentPage === 'kanban' ? 'block' : 'none' }}><Kanban active={currentPage === 'kanban'} /></div>}
          {visited.bomkanban && <div style={{ display: currentPage === 'bomkanban' ? 'block' : 'none' }}><BomKanban /></div>}
          {currentPage === 'phanquyen' && <PhanQuyen />}
        </main>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<MainApp />);
</script>
</body>
</html>
